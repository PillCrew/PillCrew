<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Pilly pet</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
      -webkit-user-select: none;
      user-select: none;
    }
    canvas { display: block; width: 100%; height: 100%; }
    body.can-drag canvas { cursor: grab; }
    body.dragging canvas { cursor: grabbing; }
    body.default canvas { cursor: pointer; }
  </style>
</head>
<body>
  <canvas id="pet"></canvas>
  <script>
    // ============================================================
    // Pilly pet - 60fps canvas renderer (Stage 1 "pro animations").
    // Smooth state transitions, walk/pause/hop/sleep/dance states,
    // particles (confetti/dust/zzz), eye tracking + blink, drag face.
    // ============================================================
    (function () {
      "use strict";
      const canvas = document.getElementById("pet");
      const ctx = canvas.getContext("2d");
      // Logical size 60x64 CSS px; crisp on any DPI.
      const W = 60, H = 64;
      const DPR = Math.max(1, Math.min(3, window.devicePixelRatio || 1));
      canvas.width = W * DPR;
      canvas.height = H * DPR;
      ctx.scale(DPR, DPR);

      const THEMES = {
        green: { c1: "#22c55e", c2: "#34d399", c3: "#6366f1" },
        blue: { c1: "#3b82f6", c2: "#38bdf8", c3: "#8b5cf6" },
        purple: { c1: "#8b5cf6", c2: "#a78bfa", c3: "#ec4899" },
        pink: { c1: "#ec4899", c2: "#f472b6", c3: "#fbbf24" },
        orange: { c1: "#f97316", c2: "#fbbf24", c3: "#ef4444" },
      };
      let theme = THEMES.green;
      let ps = 1; // size scale (sm 0.85 / md 1 / lg 1.2)

      function applyPetSettings(pet) {
        theme = (pet && THEMES[pet.theme]) || THEMES.green;
        ps = pet && pet.size === "sm" ? 0.85 : pet && pet.size === "lg" ? 1.2 : 1;
        enableDrag(!!(pet && pet.walkMode === "screen"));
        soundsOn = !pet || pet.sounds !== false;
        soundVol = pet && pet.soundVol != null ? Math.max(0, Math.min(100, Number(pet.soundVol))) : 60;
        defaultMood = pet && pet.mood === "happy" ? "happy" : pet && pet.mood === "sad" ? "sad" : "";
      }
      if (window.pilly && window.pilly.petSettings) window.pilly.petSettings().then(applyPetSettings);
      if (window.pilly && window.pilly.onPetSettings) window.pilly.onPetSettings(applyPetSettings);

      // ---- target params per state (smoothed toward each frame) ----
      const PARAMS = {
        walk:  { squX: 1.00, squY: 1.00, mouth: 0.30, tilt: 0.00, annoyed: false, eyes: 1 },
        pause: { squX: 1.00, squY: 1.02, mouth: 0.30, tilt: 0.00, annoyed: false, eyes: 1 },
        hop:   { squX: 1.00, squY: 1.00, mouth: 0.20, tilt: 0.00, annoyed: false, eyes: 1 },
        sleep: { squX: 0.97, squY: 0.93, mouth: 0.08, tilt: 0.00, annoyed: false, eyes: 0 },
        dance: { squX: 1.08, squY: 0.93, mouth: 0.85, tilt: 0.12, annoyed: false, eyes: 1 },
        drag:  { squX: 1.02, squY: 0.98, mouth: -0.50, tilt: 0.16, annoyed: true, eyes: 1 },
        flee:  { squX: 1.00, squY: 1.02, mouth: 0.15, tilt: 0.00, annoyed: false, eyes: 1 },
      };
      let state = "walk";
      let cur = { squX: 1, squY: 1, mouth: 0.3, tilt: 0, annoyed: false, eyes: 1 };
      let petDirNow = 1;
      let cursor = { x: 0, y: 0 };
      let hopStart = 0;
      const HOP_MS = 720;
      let particles = [];
      let last = performance.now();
      let blinkNext = performance.now() + 1500 + Math.random() * 2500;
      let blinkUntil = 0;
      let zzNext = performance.now() + 900;
      let talking = false; // mouth animates while a bubble is shown
      let landingUntil = 0; // brief squash after a hop lands
      let dartUntil = 0, dartNext = performance.now() + 2500 + Math.random() * 3500, dartX = 0, dartY = 0;
      let face = { px: 0, py: 0, excited: false, squint: false };
      // Stage 2: live market mood overlay - "up" (green) or "down" (red).
      let market = "";
      let marketUntil = 0;
      let bounceStart = 0, bounceUntil = 0; // happy bounce when the market goes green
      let defaultMood = ""; // resting mouth mood from settings (neutral/happy/sad)
      // Stage 3: ambient life - dance notes, idle gestures, flee, hover/click.
      let noteNext = performance.now() + 600;
      let gesture = "", gestureUntil = 0, gestureNext = performance.now() + 12000 + Math.random() * 10000;
      let thoughtNext = performance.now() + 40000 + Math.random() * 40000;
      let sweatNext = performance.now() + 500;
      let hover = false, clickUntil = 0;
      let spookStart = 0, spookUntil = 0, streakNext = performance.now() + 200;

      if (window.pilly && window.pilly.onPetDir) {
        window.pilly.onPetDir((d) => { petDirNow = d === -1 ? -1 : 1; });
      }
      if (window.pilly && window.pilly.onPetCursor) {
        window.pilly.onPetCursor((pos) => { cursor = pos; });
      }
      if (window.pilly && window.pilly.onPetState) {
        window.pilly.onPetState((s) => {
          if (s === "hop") { hopStart = performance.now(); sfx("hop"); }
          if (s === "dance") { confetti(26); sfx("confetti"); }
          if (s === "sleep") sfx("sleep");
          state = PARAMS[s] ? s : "pause";
        });
      }
      if (window.pilly && window.pilly.onPetTalking) {
        window.pilly.onPetTalking((on) => { talking = !!on; });
      }
      // A shared mood overlay used by market data (pet:market) and chat
      // sentiment (pet:mood): happy = confetti + smile + bounce,
      // sad = frown + droopy eyes + a tear.
      function triggerMood(m) {
        const kind = m && m.kind;
        const happy = kind === "up" || kind === "happy";
        const sad = kind === "down" || kind === "sad";
        if (!happy && !sad) return;
        market = happy ? "up" : "down";
        marketUntil = performance.now() + 2400;
        if (happy) {
          confetti(26);
          sfx("confetti");
          bounceStart = performance.now();
          bounceUntil = bounceStart + 720;
        } else {
          sfx("sad");
          particles.push({ type: "tear", x: 40, y: 40, vx: 0, vy: 0.18, size: 1.5, life: 0, max: 900 });
          setTimeout(() => {
            particles.push({ type: "tear", x: 40, y: 40, vx: 0, vy: 0.18, size: 1.5, life: 0, max: 900 });
          }, 340);
        }
      }
      if (window.pilly && window.pilly.onPetMarket) {
        window.pilly.onPetMarket((m) => triggerMood(m));
      }
      if (window.pilly && window.pilly.onPetMood) {
        window.pilly.onPetMood((m) => triggerMood(m));
      }
      // Cursor poked him - spooked jump + "!" pop above his head.
      if (window.pilly && window.pilly.onPetSpook) {
        window.pilly.onPetSpook(() => {
          sfx("spook");
          spookStart = performance.now();
          spookUntil = spookStart + 420;
          particles.push({ type: "bang", x: 30, y: 14, vx: 0, vy: -0.35, size: 12, life: 0, max: 520 });
        });
      }
      // Main asks Pilly to play a sound (hot-coin ding / alert ding / confetti).
      if (window.pilly && window.pilly.onPetPlay) {
        window.pilly.onPetPlay((type) => sfx(type || "coin"));
      }

      // ---- drag (whole-monitor mode only) ----
      let canDrag = false, dragging = false, dragReacted = false, moved = 0, lastX = 0, lastY = 0;
      const dragOverride = { active: false };
      function enableDrag(on) {
        canDrag = !!on;
        document.body.className = canDrag ? "can-drag" : "default";
      }
      document.addEventListener("mousedown", (e) => {
        if (!canDrag) return;
        dragging = true;
        moved = 0;
        dragReacted = false;
        lastX = e.screenX;
        lastY = e.screenY;
        dragOverride.active = true;
        document.body.className = "dragging";
        if (window.pilly) window.pilly.petDrag({ mode: "start" });
        e.preventDefault();
      });
      document.addEventListener("mousemove", (e) => {
        if (!dragging || !canDrag) return;
        const dx = e.screenX - lastX;
        const dy = e.screenY - lastY;
        lastX = e.screenX;
        lastY = e.screenY;
        moved += Math.abs(dx) + Math.abs(dy);
        if (window.pilly) window.pilly.petDrag({ mode: "move", dx, dy });
        // Only act annoyed after a REAL drag - a plain click must not trigger
        // the "put me down!" reaction.
        if (!dragReacted && moved > 12) {
          dragReacted = true;
          if (window.pilly) window.pilly.petReact("dragstart");
        }
      });
      document.addEventListener("mouseup", () => {
        if (!dragging) return;
        dragging = false;
        dragOverride.active = false;
        document.body.className = canDrag ? "can-drag" : "default";
        if (window.pilly) window.pilly.petDrag({ mode: "end" });
        if (dragReacted && window.pilly) window.pilly.petReact("dragend");
      });
      document.addEventListener("click", (e) => {
        if (moved > 6) return; // it was a drag, not a click
        ensureAudio();
        sfx("boop");
        clickUntil = performance.now() + 180; // quick tap squish
        // a little "love" pop makes him feel alive
        particles.push({
          type: "emoji", x: 30 + (Math.random() - 0.5) * 14, y: 34,
          vx: (Math.random() - 0.5) * 0.25, vy: -0.5 - Math.random() * 0.2,
          size: 9 + Math.random() * 3, life: 0, max: 900,
          glyph: Math.random() < 0.6 ? "💗" : "✨",
        });
        if (window.pilly) window.pilly.openChat();
      });
      document.addEventListener("mouseover", () => { hover = true; ensureAudio(); });
      document.addEventListener("mouseout", () => { hover = false; });

      // ---- particles ----
      function confetti(n) {
        const cols = ["#22c55e", "#fbbf24", "#f472b6", "#38bdf8", "#a78bfa", "#ef4444"];
        for (let i = 0; i < n; i++) {
          particles.push({
            type: "confetti",
            x: 30 + (Math.random() - 0.5) * 26,
            y: 16 + Math.random() * 10,
            vx: (Math.random() - 0.5) * 1.6,
            vy: 0.6 + Math.random() * 1.2,
            rot: Math.random() * Math.PI,
            vr: (Math.random() - 0.5) * 0.3,
            size: 2 + Math.random() * 2,
            color: cols[(Math.random() * cols.length) | 0],
            life: 0,
            max: 55 + Math.random() * 45,
          });
        }
      }
      function dust(x) {
        for (let i = 0; i < 5; i++) {
          particles.push({
            type: "dust",
            x: x + (Math.random() - 0.5) * 12,
            y: 61,
            vx: (Math.random() - 0.5) * 0.7,
            vy: -0.25 - Math.random() * 0.45,
            size: 1.4 + Math.random() * 1.6,
            life: 0,
            max: 28 + Math.random() * 22,
          });
        }
      }

      // ---- Stage 4: WebAudio sound effects (no files, optional) ----
      // Richer engine: layered tones + a noise burst, volume-aware.
      let soundsOn = true;
      let soundVol = 60;
      let audioCtx = null;
      function ensureAudio() {
        try {
          if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
        } catch (e) { /* ignore */ }
      }
      function tone(o) {
        if (!soundsOn || !audioCtx) return;
        try {
          ensureAudio();
          if (!audioCtx) return;
          const now = audioCtx.currentTime + (o.delay || 0);
          const osc = audioCtx.createOscillator();
          const g = audioCtx.createGain();
          osc.type = o.wave || "sine";
          osc.frequency.setValueAtTime(o.f0, now);
          if (o.glide === "lin") osc.frequency.linearRampToValueAtTime(o.f1, now + o.dur);
          else osc.frequency.exponentialRampToValueAtTime(Math.max(30, o.f1), now + o.dur);
          const vol = (o.gain || 0.06) * (soundVol / 100);
          g.gain.setValueAtTime(vol, now);
          g.gain.exponentialRampToValueAtTime(0.0001, now + o.dur);
          osc.connect(g); g.connect(audioCtx.destination);
          osc.start(now); osc.stop(now + o.dur + 0.04);
        } catch (e) { /* ignore */ }
      }
      function noise(dur, gain, delay) {
        if (!soundsOn || !audioCtx) return;
        try {
          ensureAudio();
          if (!audioCtx) return;
          const now = audioCtx.currentTime + (delay || 0);
          const n = Math.max(1, Math.floor(audioCtx.sampleRate * dur));
          const buf = audioCtx.createBuffer(1, n, audioCtx.sampleRate);
          const d = buf.getChannelData(0);
          for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
          const src = audioCtx.createBufferSource();
          src.buffer = buf;
          const f = audioCtx.createBiquadFilter();
          f.type = "lowpass"; f.frequency.value = 2400;
          const g = audioCtx.createGain();
          g.gain.setValueAtTime((gain || 0.05) * (soundVol / 100), now);
          g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
          src.connect(f); f.connect(g); g.connect(audioCtx.destination);
          src.start(now); src.stop(now + dur + 0.02);
        } catch (e) { /* ignore */ }
      }
      function sfx(type) {
        if (!soundsOn) return;
        ensureAudio();
        if (!audioCtx) return;
        if (type === "hop") {
          tone({ f0: 240, f1: 520, dur: 0.14, wave: "triangle", gain: 0.07 });
          tone({ f0: 480, f1: 760, dur: 0.1, wave: "sine", gain: 0.04, delay: 0.06 });
        } else if (type === "spook") {
          tone({ f0: 1000, f1: 160, dur: 0.4, wave: "sawtooth", gain: 0.05 });
          noise(0.18, 0.05);
        } else if (type === "confetti") {
          tone({ f0: 523, f1: 660, dur: 0.12, wave: "triangle", gain: 0.06 });
          tone({ f0: 660, f1: 880, dur: 0.12, wave: "triangle", gain: 0.06, delay: 0.09 });
          tone({ f0: 880, f1: 1175, dur: 0.18, wave: "triangle", gain: 0.06, delay: 0.18 });
        } else if (type === "sad") {
          tone({ f0: 392, f1: 262, dur: 0.4, wave: "triangle", gain: 0.06 });
          tone({ f0: 330, f1: 220, dur: 0.45, wave: "sine", gain: 0.04, delay: 0.15 });
        } else if (type === "sleep") {
          tone({ f0: 220, f1: 160, dur: 0.35, wave: "sine", gain: 0.05 });
          tone({ f0: 180, f1: 130, dur: 0.35, wave: "sine", gain: 0.04, delay: 0.2 });
        } else if (type === "boop") {
          tone({ f0: 700, f1: 950, dur: 0.08, wave: "sine", gain: 0.05 });
        } else if (type === "question") {
          tone({ f0: 660, f1: 660, dur: 0.1, wave: "sine", gain: 0.05 });
          tone({ f0: 880, f1: 880, dur: 0.16, wave: "sine", gain: 0.05, delay: 0.12 });
        } else if (type === "coin") {
          tone({ f0: 880, f1: 880, dur: 0.08, wave: "square", gain: 0.04 });
          tone({ f0: 1318, f1: 1318, dur: 0.22, wave: "square", gain: 0.04, delay: 0.08 });
          tone({ f0: 1760, f1: 1760, dur: 0.18, wave: "sine", gain: 0.03, delay: 0.16 });
        } else if (type === "alert") {
          tone({ f0: 740, f1: 740, dur: 0.1, wave: "square", gain: 0.045 });
          tone({ f0: 740, f1: 740, dur: 0.1, wave: "square", gain: 0.045, delay: 0.16 });
          tone({ f0: 988, f1: 988, dur: 0.2, wave: "square", gain: 0.04, delay: 0.32 });
        }
      }

      function roundRect(x, y, w, h, r) {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.arcTo(x + w, y, x + w, y + h, r);
        ctx.arcTo(x + w, y + h, x, y + h, r);
        ctx.arcTo(x, y + h, x, y, r);
        ctx.arcTo(x, y, x + w, y, r);
        ctx.closePath();
      }

      function drawEye(ex, ey, open, excited, squint, pupilX, pupilY, lid) {
        if (open) {
          ctx.fillStyle = "#0b0f0d";
          roundRect(ex - 3, ey - 3.5, 6, 7, 3);
          ctx.fill();
          // pupil (white) - follows cursor, bigger when excited
          const pr = excited ? 1.6 : 1.1;
          ctx.fillStyle = "#fff";
          ctx.beginPath();
          ctx.arc(ex + pupilX, ey + pupilY, pr, 0, Math.PI * 2);
          ctx.fill();
          // gloss highlight (pro touch)
          ctx.fillStyle = "rgba(255,255,255,0.55)";
          ctx.beginPath();
          ctx.arc(ex - 1.7, ey - 2, 0.8, 0, Math.PI * 2);
          ctx.fill();
          // eyelid: squint when annoyed, droopy when sad
          const lidH = lid ? lid * 7 : squint ? 2.8 : 0;
          if (lidH > 0) {
            ctx.fillStyle = "#0b0f0d";
            roundRect(ex - 3, ey - 3.5, 6, lidH, 1);
            ctx.fill();
          }
        } else {
          ctx.strokeStyle = "#0b0f0d";
          ctx.lineWidth = 1.4;
          ctx.beginPath();
          ctx.moveTo(ex - 3, ey);
          ctx.lineTo(ex + 3, ey);
          ctx.stroke();
        }
      }

      function drawMouth(v, now, mood) {
        // open/close mouth while talking (bubble visible)
        if (talking) {
          const ph = 0.5 + 0.5 * Math.sin((now / 1000) * 24);
          ctx.fillStyle = "#0b0f0d";
          ctx.beginPath();
          ctx.ellipse(0, -4.8, 3 + ph * 1.4, 0.9 + ph * 1.8, 0, 0, Math.PI * 2);
          ctx.fill();
          return;
        }
        if (mood === "yawn") {
          // big sleepy yawn
          ctx.fillStyle = "#0b0f0d";
          ctx.beginPath();
          ctx.ellipse(0, -4.8, 3.2, 3.4, 0, 0, Math.PI * 2);
          ctx.fill();
          return;
        }
        if (mood === "scared") {
          // startled little "o"
          ctx.fillStyle = "#0b0f0d";
          ctx.beginPath();
          ctx.ellipse(0, -5, 1.6, 2.2, 0, 0, Math.PI * 2);
          ctx.fill();
          return;
        }
        if (mood === "curious") {
          // curious little "o"
          ctx.fillStyle = "#0b0f0d";
          ctx.beginPath();
          ctx.ellipse(0, -5.2, 1.4, 1.8, 0, 0, Math.PI * 2);
          ctx.fill();
          return;
        }
        ctx.strokeStyle = "#0b0f0d";
        ctx.lineWidth = 1.5;
        ctx.lineCap = "round";
        ctx.beginPath();
        if (mood === "happy") {
          // smile
          ctx.moveTo(-4.5, -5.5);
          ctx.quadraticCurveTo(0, -3.2, 4.5, -5.5);
        } else if (mood === "sad") {
          // frown
          ctx.moveTo(-4.5, -4.6);
          ctx.quadraticCurveTo(0, -7.6, 4.5, -4.6);
        } else {
          ctx.moveTo(-4.5, -5.5);
          ctx.quadraticCurveTo(0, -5.5 + v * 3.4, 4.5, -5.5);
        }
        ctx.stroke();
      }

      function drawBody(now) {
        // capsule body
        const grd = ctx.createLinearGradient(0, -23, 0, 0);
        grd.addColorStop(0, theme.c1);
        grd.addColorStop(0.55, theme.c2);
        grd.addColorStop(1, theme.c3);
        ctx.fillStyle = grd;
        roundRect(-20, -23, 40, 23, 11.5);
        ctx.fill();
        // rim
        ctx.strokeStyle = "rgba(0,0,0,0.16)";
        ctx.lineWidth = 1;
        roundRect(-20, -23, 40, 23, 11.5);
        ctx.stroke();
        // top gloss - soft sheen that hugs the forehead, fading at both ends so
        // it never reads as a hard line over the brow (the old flat band did).
        ctx.save();
        roundRect(-20, -23, 40, 23, 11.5);
        ctx.clip();
        const gloss = ctx.createLinearGradient(0, -22, 0, -14);
        gloss.addColorStop(0, "rgba(255,255,255,0)");
        gloss.addColorStop(0.5, "rgba(255,255,255,0.34)");
        gloss.addColorStop(1, "rgba(255,255,255,0)");
        ctx.fillStyle = gloss;
        ctx.fillRect(-20, -22, 40, 8);
        ctx.restore();

        // face
        let mood = defaultMood;
        if (now < marketUntil) mood = market;
        else if (gesture === "yawn" && now < gestureUntil) mood = "yawn";
        else if (gesture === "wave" && now < gestureUntil) mood = "happy";
        else if (gesture === "wiggle" && now < gestureUntil) mood = "happy";
        else if (gesture === "curious" && now < gestureUntil) mood = "curious";
        else if (state === "flee") mood = "scared";
        const eyesOpen = cur.eyes === 1 && !(now < blinkUntil) && !(gesture === "yawn" && now < gestureUntil);
        const eyeY = -14.5;
        const lid = now < marketUntil && market === "down" ? 0.6 : 0;
        drawEye(-11, eyeY, eyesOpen, face.excited, face.squint, face.px, face.py, lid);
        drawEye(9, eyeY, eyesOpen, face.excited, face.squint, face.px, face.py, lid);
        if (cur.annoyed) {
          ctx.strokeStyle = "#0b0f0d";
          ctx.lineWidth = 1.6;
          ctx.beginPath();
          ctx.moveTo(-17, -22.5); ctx.lineTo(-6, -19.5);
          ctx.moveTo(17, -22.5); ctx.lineTo(6, -19.5);
          ctx.stroke();
        }
        drawMouth(cur.mouth, now, mood);
      }

      function draw(now, dt) {
        ctx.clearRect(0, 0, W, H);
        const t = now / 1000;
        // Blink: a living pet blinks. Occasional slow blink for a natural beat.
        if (cur.eyes === 1 && now > blinkNext) {
          const slow = Math.random() < 0.2;
          blinkUntil = now + (slow ? 300 : 120);
          blinkNext = now + (slow ? 1500 : 2200) + Math.random() * (slow ? 2400 : 3400);
        }
        const base = dragOverride.active ? PARAMS.drag : (PARAMS[state] || PARAMS.pause);
        const k = 1 - Math.exp((-dt / 1000) * 9);
        cur.squX += (base.squX - cur.squX) * k;
        cur.squY += (base.squY - cur.squY) * k;
        cur.mouth += (base.mouth - cur.mouth) * k;
        cur.tilt += (base.tilt - cur.tilt) * k;
        cur.annoyed = base.annoyed;
        cur.eyes = base.eyes;

        // vertical bob / rotation per state
        let bodyY = 0, rot = 0;
        if (state === "walk") {
          // step phase: bob + rocking + subtle squash-stretch
          const ph = Math.sin(t * 9);
          bodyY = -Math.abs(ph) * 3.4;
          rot = Math.sin(t * 4.5) * 0.06;
          cur.squX = 1 + 0.05 * Math.sin(t * 18);
          cur.squY = 1 - 0.04 * Math.sin(t * 18);
        } else if (state === "dance") {
          bodyY = -Math.abs(Math.sin(t * 13)) * 4.5;
          rot = Math.sin(t * 7) * 0.13;
        } else if (state === "pause") {
          bodyY = -Math.abs(Math.sin(t * 2.1)) * 1.4; // breathe
          rot = Math.sin(t * 0.7) * 0.04; // gentle idle sway while hanging out
        } else if (state === "sleep") {
          bodyY = Math.sin(t * 0.9) * 1.6; // slow, deep breathing
          cur.tilt = 0.05; // sleepy tilt
        } else if (state === "flee") {
          bodyY = -Math.abs(Math.sin(t * 20)) * 5; // panicked scurry
          rot = Math.sin(t * 9) * 0.1;
        } else if (state === "hop" && now - hopStart < HOP_MS) {
          const p = (now - hopStart) / HOP_MS;
          const h = Math.sin(p * Math.PI);
          bodyY = -h * 16;
          cur.squX = 1 + 0.22 * (1 - h);
          cur.squY = 1 - 0.22 * (1 - h);
          if (p > 0.85) dust(30);
          if (p >= 0.97) landingUntil = now + 170;
        }
        // happy bounce when the market goes green
        if (now < bounceUntil) {
          const p = (now - bounceStart) / 720;
          bodyY -= Math.sin(p * Math.PI) * 7;
        }
        // spooked jump when the cursor pokes Pilly
        if (now < spookUntil) {
          const p = (now - spookStart) / 420;
          bodyY -= Math.sin(p * Math.PI) * 10;
        }
        // waving: gentle rock side to side
        if (gesture === "wave" && now < gestureUntil) rot += Math.sin(t * 6) * 0.08;
        // wiggle: quick excited shimmy
        if (gesture === "wiggle" && now < gestureUntil) rot += Math.sin(t * 20) * 0.12;
        // curious: slow, thoughtful sway
        if (gesture === "curious" && now < gestureUntil) rot += Math.sin(t * 1.6) * 0.04;
        // soft landing squash after the hop
        if (now < landingUntil) {
          const landK = (landingUntil - now) / 170;
          const k2 = 1 - Math.exp((-dt / 1000) * 16);
          cur.squX += (1 + 0.16 * landK - cur.squX) * k2;
          cur.squY += (1 - 0.15 * landK - cur.squY) * k2;
        }
        // gentle squash while the cursor hovers over Pilly
        if (hover && state !== "drag" && !(now < marketUntil) && !(gesture === "wave" && now < gestureUntil)) {
          cur.squX += (1.07 - cur.squX) * k;
          cur.squY += (0.95 - cur.squY) * k;
        }
        // quick tap squish on click
        if (now < clickUntil) {
          const p = (clickUntil - now) / 180;
          cur.squX += (1 + 0.18 * p - cur.squX) * k;
          cur.squY += (1 - 0.16 * p - cur.squY) * k;
        }

        // occasional idle gestures while hanging out (wave / yawn / curious / wiggle)
        if ((state === "pause" || state === "walk") && now > gestureNext && !talking && now >= marketUntil && !gesture) {
          gestureNext = now + 15000 + Math.random() * 15000;
          const gr = Math.random();
          if (gr < 0.32) gesture = "wave";
          else if (gr < 0.58) gesture = "yawn";
          else if (gr < 0.8) gesture = "curious";
          else gesture = "wiggle";
          gestureUntil = now + 1100;
          if (gesture === "wave") {
            particles.push({ type: "emoji", x: 44, y: 30, vx: 0.25, vy: -0.3, size: 10, life: 0, max: 1000, glyph: "👋" });
          } else if (gesture === "curious") {
            particles.push({ type: "emoji", x: 44, y: 14, vx: 0.1, vy: -0.2, size: 9, life: 0, max: 900, glyph: "?" });
            dartX = 0; dartY = -1.4; dartUntil = now + 1100; dartNext = now + 1100;
          } else if (gesture === "wiggle") {
            particles.push({ type: "emoji", x: 44, y: 30, vx: 0.2, vy: -0.25, size: 9, life: 0, max: 900, glyph: "✨" });
          }
        }
        // Stage 6: occasional random moods / thought bubbles while hanging out
        if ((state === "pause" || state === "walk") && now > thoughtNext && !talking && now >= marketUntil && !gesture) {
          thoughtNext = now + 40000 + Math.random() * 45000;
          if (Math.random() < 0.6) {
            market = Math.random() < 0.5 ? "up" : "down";
            marketUntil = now + 2200;
          } else {
            const thoughts = ["💭", "🤔", "😌", "✨", "😏", "🫠"];
            particles.push({
              type: "emoji", x: 44, y: 16,
              vx: 0.2, vy: -0.3, size: 9,
              life: 0, max: 1100,
              glyph: thoughts[(Math.random() * thoughts.length) | 0],
            });
            sfx("question");
          }
        }
        // idle eye-dart (pause only): pupils glance around sometimes
        if (state === "pause" && now > dartNext) {
          dartX = (Math.random() - 0.5) * 2.2;
          dartY = (Math.random() - 0.5) * 1.4;
          dartUntil = now + 260;
          dartNext = now + 3200 + Math.random() * 4000;
        }
        const useDart = now < dartUntil;
        const cursorDist = Math.hypot(cursor.x, cursor.y);
        const alert = state !== "flee" && state !== "sleep" && cursorDist < 95;
        const excited = state === "dance" || state === "flee" || alert || talking || (now < marketUntil && market === "up");
        const squint = cur.annoyed;
        const cx = useDart ? dartX : Math.max(-1.2, Math.min(1.2, (cursor.x / 120) * 1.2)) * petDirNow;
        const cy = useDart ? dartY : Math.max(-1.2, Math.min(1.2, (cursor.y / 120) * 1.2));
        face.px = cx; face.py = cy; face.excited = excited; face.squint = squint;

        // soft radial shadow (pro, scales with jump height)
        const shScale = Math.max(0.4, 1 - (bodyY / 40) * 0.65);
        ctx.save();
        ctx.translate(30, 62);
        ctx.scale(shScale, 0.25 * shScale);
        const g = ctx.createRadialGradient(0, 0, 1, 0, 0, 16);
        g.addColorStop(0, "rgba(0,0,0,0.5)");
        g.addColorStop(1, "rgba(0,0,0,0)");
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(0, 0, 16, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        // pill (mirrored by direction)
        ctx.save();
        ctx.translate(30, 53 + bodyY);
        ctx.scale(petDirNow, 1);
        ctx.rotate(rot);
        ctx.scale(cur.squX * ps, cur.squY * ps);
        drawBody(now);
        ctx.restore();
      }

      function updateParticles(now, dt) {
        // spawn zzz while sleeping
        if (state === "sleep" && now > zzNext) {
          zzNext = now + 650 + Math.random() * 500;
          particles.push({
            type: "zz",
            x: 17, y: 20,
            vx: 0.25, vy: -0.35,
            size: 6 + Math.random() * 4,
            life: 0, max: 1300,
          });
        }
        // music notes while dancing
        if (state === "dance" && now > noteNext) {
          noteNext = now + 420 + Math.random() * 500;
          particles.push({
            type: "note",
            x: 30 + (Math.random() - 0.5) * 30,
            y: 8 + Math.random() * 14,
            vx: (Math.random() - 0.5) * 0.5,
            vy: -0.6 - Math.random() * 0.5,
            size: 7 + Math.random() * 4,
            life: 0, max: 900,
            glyph: Math.random() < 0.5 ? "♪" : "♫",
          });
        }
        // sweat drop while fleeing the cursor
        if (state === "flee" && now > sweatNext) {
          sweatNext = now + 380;
          particles.push({ type: "sweat", x: 44, y: 36, vx: 0.1, vy: 0.35, size: 1.6, life: 0, max: 500 });
        }
        // motion streaks while sprinting away
        if (state === "flee" && now > streakNext) {
          streakNext = now + 90;
          const dir = petDirNow;
          particles.push({
            type: "streak",
            x: 30 - dir * 13,
            y: 38 + (Math.random() - 0.5) * 18,
            vx: -dir * 1.6,
            vy: 0,
            size: 1.5 + Math.random() * 1.5,
            life: 0, max: 200,
          });
        }
        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          p.life += dt;
          p.x += p.vx;
          p.y += p.vy;
          if (p.type !== "zz" && p.vy < 1.4) p.vy += 0.02;
          if (p.vr) p.rot += p.vr;
          const a = Math.max(0, 1 - p.life / p.max);
          if (p.type === "confetti") {
            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.rotate(p.rot);
            ctx.globalAlpha = a;
            ctx.fillStyle = p.color;
            ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.6);
            ctx.restore();
          } else if (p.type === "dust") {
            ctx.globalAlpha = a * 0.5;
            ctx.fillStyle = "#999";
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            ctx.fill();
            ctx.globalAlpha = 1;
          } else if (p.type === "zz") {
            ctx.save();
            ctx.globalAlpha = a;
            ctx.fillStyle = theme.c2;
            ctx.font = p.size + "px sans-serif";
            ctx.fillText("z", p.x, p.y);
            ctx.restore();
          } else if (p.type === "tear") {
            ctx.globalAlpha = a;
            ctx.fillStyle = "#7dd3fc";
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            ctx.fill();
            ctx.globalAlpha = 1;
          } else if (p.type === "sweat") {
            ctx.globalAlpha = a;
            ctx.fillStyle = "#93c5fd";
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            ctx.fill();
            ctx.globalAlpha = 1;
          } else if (p.type === "note" || p.type === "emoji") {
            ctx.save();
            ctx.globalAlpha = a;
            ctx.fillStyle = p.type === "note" ? theme.c2 : "#fff";
            ctx.font = p.size + "px sans-serif";
            ctx.fillText(p.glyph, p.x, p.y);
            ctx.restore();
          } else if (p.type === "bang") {
            ctx.save();
            ctx.globalAlpha = a;
            ctx.fillStyle = "#f87171";
            ctx.font = "bold " + p.size + "px sans-serif";
            ctx.fillText("!", p.x, p.y);
            ctx.restore();
          } else if (p.type === "streak") {
            ctx.globalAlpha = a * 0.5;
            ctx.strokeStyle = "#fff";
            ctx.lineWidth = 1.2;
            ctx.beginPath();
            ctx.moveTo(p.x, p.y);
            ctx.lineTo(p.x + p.vx * 6, p.y);
            ctx.stroke();
            ctx.globalAlpha = 1;
          }
          if (p.life >= p.max) particles.splice(i, 1);
        }
      }

      function frame(now) {
        const dt = Math.min(50, now - last);
        last = now;
        updateParticles(now, dt);
        draw(now, dt);
        requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
