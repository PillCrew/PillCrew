<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Pilly pet</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
      -webkit-user-select: none;
      user-select: none;
    }
    canvas { display: block; width: 100%; height: 100%; }
    body.can-drag canvas { cursor: grab; }
    body.dragging canvas { cursor: grabbing; }
    body.default canvas { cursor: pointer; }
  </style>
</head>
<body>
  <canvas id="pet"></canvas>
  <script>
    // ============================================================
    // Pilly pet - 60fps canvas renderer (Stage 1 "pro animations").
    // Smooth state transitions, walk/pause/hop/sleep/dance states,
    // particles (confetti/dust/zzz), eye tracking + blink, drag face.
    // ============================================================
    (function () {
      "use strict";
      const canvas = document.getElementById("pet");
      const ctx = canvas.getContext("2d");
      // Logical size 60x64 CSS px; crisp on any DPI.
      const W = 60, H = 64;
      // Dragging Pilly between screens with different scale factors (a Retina
      // MacBook and a plain external monitor) changes devicePixelRatio. The
      // canvas used to keep the backing store it was born with, so he went
      // blurry/aliased on whichever screen he was not created on.
      function applyDpr() {
        const dpr = Math.max(1, Math.min(3, window.devicePixelRatio || 1));
        if (canvas.width !== W * dpr || canvas.height !== H * dpr) {
          canvas.width = W * dpr;
          canvas.height = H * dpr;
        }
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }
      applyDpr();
      let dprQuery = null;
      function onDprChange() {
        applyDpr();
        watchDpr();
      }
      function watchDpr() {
        if (dprQuery && dprQuery.removeEventListener) dprQuery.removeEventListener("change", onDprChange);
        dprQuery = null;
        try {
          dprQuery = window.matchMedia(`(resolution: ${window.devicePixelRatio}dppx)`);
          dprQuery.addEventListener("change", onDprChange);
        } catch (e) { dprQuery = null; }
      }
      watchDpr();
      window.addEventListener("resize", applyDpr);

      // v1.1.2: respect the OS "reduce motion" setting. He stays alive - he
      // still blinks, sways, looks around and says hi - but the gestures that
      // fling the whole pill around (spin, wiggle, giggle) stay out of the idle
      // rotation, which is the part nobody asked for.
      const motionQuery = window.matchMedia ? window.matchMedia("(prefers-reduced-motion: reduce)") : null;
      let reduceMotion = !!(motionQuery && motionQuery.matches);
      const CALM_GESTURES = ["wave", "yawn", "stretch", "peek", "curious", "heart"];
      // The main process cannot read this preference on every platform, so the
      // renderers report it. Reported again whenever the user flips the switch,
      // so turning it on calms the tray icon too without a restart.
      function reportMotionPref() {
        try {
          if (window.pilly && window.pilly.setUiPrefs) window.pilly.setUiPrefs({ reduceMotion: !!reduceMotion });
        } catch (e) { /* main process already gone */ }
      }
      reportMotionPref();
      if (motionQuery && motionQuery.addEventListener) {
        motionQuery.addEventListener("change", (e) => { reduceMotion = !!e.matches; reportMotionPref(); });
      }

      const THEMES = {
        green: { c1: "#22c55e", c2: "#34d399", c3: "#6366f1" },
        blue: { c1: "#3b82f6", c2: "#38bdf8", c3: "#8b5cf6" },
        purple: { c1: "#8b5cf6", c2: "#a78bfa", c3: "#ec4899" },
        pink: { c1: "#ec4899", c2: "#f472b6", c3: "#fbbf24" },
        orange: { c1: "#f97316", c2: "#fbbf24", c3: "#ef4444" },
        // v1.1.3: the plush look - Pilly as the crocheted toy from the brand
        // logo, teal yarn with button eyes and stitched seams.
        plush: { c1: "#3ab8c4", c2: "#26929f", c3: "#0d7c86", plush: true },
      };
      let theme = THEMES.green;
      let ps = 1; // size scale (sm 0.85 / md 1 / lg 1.2)

      function applyPetSettings(pet) {
        theme = (pet && THEMES[pet.theme]) || THEMES.green;
        ps = pet && pet.size === "sm" ? 0.85 : pet && pet.size === "lg" ? 1.2 : 1;
        soundsOn = !pet || pet.sounds !== false;
        soundVol = pet && pet.soundVol != null ? Math.max(0, Math.min(100, Number(pet.soundVol))) : 60;
        defaultMood = pet && pet.mood === "happy" ? "happy" : pet && pet.mood === "sad" ? "sad" : "";
      }
      if (window.pilly && window.pilly.petSettings) {
        // The reply can fail (main busy, a settings file it cannot read), and this
        // window has no console the user can open, so it is handled instead of left
        // to an unhandled rejection. Nothing here is load-bearing: a pet with no
        // settings still gets the default theme, size and sounds, and pick-up is
        // not a setting at all - the drag section arms it on its own.
        Promise.resolve(window.pilly.petSettings()).then(applyPetSettings).catch((err) => {
          console.warn("Pilly could not read his pet settings:", err && err.message ? err.message : err);
        });
      }
      if (window.pilly && window.pilly.onPetSettings) window.pilly.onPetSettings(applyPetSettings);

      // ---- target params per state (smoothed toward each frame) ----
      const PARAMS = {
        walk:  { squX: 1.00, squY: 1.00, mouth: 0.30, tilt: 0.00, annoyed: false, eyes: 1 },
        pause: { squX: 1.00, squY: 1.02, mouth: 0.30, tilt: 0.00, annoyed: false, eyes: 1 },
        hop:   { squX: 1.00, squY: 1.00, mouth: 0.20, tilt: 0.00, annoyed: false, eyes: 1 },
        sleep: { squX: 0.97, squY: 0.93, mouth: 0.08, tilt: 0.00, annoyed: false, eyes: 0 },
        dance: { squX: 1.08, squY: 0.93, mouth: 0.85, tilt: 0.12, annoyed: false, eyes: 1 },
        drag:  { squX: 1.02, squY: 0.98, mouth: -0.50, tilt: 0.16, annoyed: true, eyes: 1 },
        flee:  { squX: 1.00, squY: 1.02, mouth: 0.15, tilt: 0.00, annoyed: false, eyes: 1 },
        eat:   { squX: 1.05, squY: 0.94, mouth: 0.90, tilt: 0.02, annoyed: false, eyes: 1 },
      };
      let state = "walk";
      let cur = { squX: 1, squY: 1, mouth: 0.3, tilt: 0, annoyed: false, eyes: 1 };
      let petDirNow = 1;
      let cursor = { x: 0, y: 0 };
      let hopStart = 0;
      const HOP_MS = 720;
      const HOP_ANTIC = 0.16; // share of the hop spent coiling before the launch
      // Squash/stretch keyframes for a hop: [progress, squX, squY].
      // Coil -> uncoil into a stretch -> neutral at the apex -> squash on
      // contact. Interpolating between keyframes keeps the shape continuous,
      // so the phases never snap into each other.
      const HOP_SHAPE = [
        [0.00, 1.00, 1.00],
        [0.16, 1.20, 0.78],
        [0.30, 0.88, 1.14],
        [0.55, 1.00, 1.00],
        [0.85, 0.96, 1.05],
        [1.00, 1.06, 0.96],
      ];
      const hopKf = { x: 1, y: 1 };
      function hopShapeAt(p, out) {
        for (let i = 0; i < HOP_SHAPE.length - 1; i++) {
          const a = HOP_SHAPE[i], b = HOP_SHAPE[i + 1];
          if (p <= b[0]) {
            const u = (p - a[0]) / (b[0] - a[0] || 1);
            out.x = a[1] + (b[1] - a[1]) * u;
            out.y = a[2] + (b[2] - a[2]) * u;
            return out;
          }
        }
        const last = HOP_SHAPE[HOP_SHAPE.length - 1];
        out.x = last[1];
        out.y = last[2];
        return out;
      }
      let particles = [];
      let last = performance.now();
      const bornAt = performance.now(); // birth pop-in (v1.1.2)
      let birthDustDone = false;
      let blinkNext = performance.now() + 1500 + Math.random() * 2500;
      let blinkUntil = 0;
      let blinkStart = 0; // when the current blink began (v1.1.2: eased lid)
      let blinkAgainAt = 0; // double-blink follow-up (v1.1.2)
      let zzNext = performance.now() + 900;
      let talking = false; // mouth animates while a bubble is shown
      let landingUntil = 0; // brief squash after a hop lands
      let eatUntil = 0; // munching a fresh coin (v1.1.1)
      let crumbNext = 0; // gold crumbs cadence while eating
      let dartUntil = 0, dartNext = performance.now() + 2500 + Math.random() * 3500, dartX = 0, dartY = 0;
      let face = { px: 0, py: 0, excited: false, squint: false };
      // Stage 2: live market mood overlay - "up" (green) or "down" (red).
      let market = "";
      let marketUntil = 0;
      let bounceStart = 0, bounceUntil = 0; // happy bounce when the market goes green
      let defaultMood = ""; // resting mouth mood from settings (neutral/happy/sad)
      // Stage 3: ambient life - dance notes, idle gestures, flee, hover/click.
      let noteNext = performance.now() + 600;
      let gesture = "", gestureUntil = 0, gestureStart = 0, gestureNext = performance.now() + 12000 + Math.random() * 10000;
      // v1.1.2: the coin flip only counts as caught once per toss.
      let coinCaught = false;
      // A gesture firing twice in a row reads as a stutter, not as life.
      let lastGesture = "", gestureChain = "";
      // Some gestures flow naturally into the next one - a yawn into a stretch,
      // a wave into a happy wiggle. Chaining them makes idle time feel scripted
      // by someone who knows the character.
      const GESTURE_COMBO = { yawn: "stretch", wave: "wiggle", stretch: "curious", coin: "giggle" };
      // How long each gesture runs - shared by the idle scheduler and the
      // "you came back" greeting.
      const GESTURE_MS = {
        peek: 1300, sneeze: 700, heart: 1500, stretch: 1000,
        wiggle: 900, giggle: 950, spin: 820, coin: 1250,
      };

      // v1.1.2: Pilly lives on your clock. A pet who yawns exactly as often at
      // 2am as at 9am reads as a random-number generator; weighting his idle
      // behaviour by the time of day is what makes him feel like he shares your
      // day. Every gesture keeps a non-zero weight in every part of the day -
      // he is drowsy at night, not broken - only the odds move.
      // Takes an optional epoch timestamp (the harness passes a known hour); the
      // default is the wall clock. It must NOT be handed the render loop's
      // performance.now() - that counts from page load, so he would live through
      // a whole "day" in eleven hours of uptime instead of following yours.
      function dayPart(ms) {
        const h = new Date(ms === undefined ? Date.now() : ms).getHours();
        if (h >= 5 && h < 10) return "morning";
        if (h >= 10 && h < 17) return "day";
        if (h >= 17 && h < 23) return "evening";
        return "night";
      }
      const DAY_PART_GESTURES = {
        // just woken up: peppy, waving, wiggling, up for anything
        morning: [["wave", 4], ["wiggle", 3], ["giggle", 3], ["stretch", 2], ["curious", 2], ["coin", 2], ["heart", 1], ["peek", 1], ["sneeze", 1], ["yawn", 1], ["spin", 1]],
        // deep in the work day: watchful and curious (and counting the coins)
        day: [["curious", 4], ["coin", 3], ["peek", 3], ["sneeze", 2], ["wave", 2], ["wiggle", 2], ["stretch", 1], ["heart", 1], ["yawn", 1], ["giggle", 1], ["spin", 1]],
        // winding down: stretching, softer
        evening: [["stretch", 3], ["yawn", 3], ["peek", 2], ["curious", 2], ["heart", 2], ["wave", 2], ["coin", 1], ["wiggle", 1], ["sneeze", 1], ["giggle", 1], ["spin", 1]],
        // late: sleepy but still himself
        night: [["yawn", 5], ["stretch", 4], ["peek", 3], ["heart", 2], ["curious", 2], ["coin", 1], ["wave", 1], ["sneeze", 1], ["wiggle", 1], ["giggle", 1], ["spin", 1]],
      };
      // The same idea applied to pacing: he takes longer between idle moments
      // late at night and is quickest in the morning.
      const DAY_PART_PACE = { morning: 0.7, day: 1, evening: 1.15, night: 1.7 };
      // v1.1.2: at night his lids sit a little lower. The gesture weights already
      // make him yawn more after midnight, but you can only see that once every
      // twenty seconds; a permanently drowsy lid is the same information, always
      // on screen, and it is the cheapest way to make him share your day.
      function nightDroop(ms) {
        return dayPart(ms) === "night" ? 0.3 : 0;
      }
      function pickWeighted(table) {
        let total = 0;
        for (const [, w] of table) total += w;
        let r = Math.random() * total;
        for (const [name, w] of table) { r -= w; if (r <= 0) return name; }
        return table[table.length - 1][0];
      }
      // Decide what he does next: a combo follow-up first (a real continuation
      // of what he just did), otherwise a weighted pick for the time of day that
      // is never the gesture he just finished. Reduce-motion always wins.
      function pickIdleGesture(part) {
        let pick = gestureChain || "";
        gestureChain = "";
        for (let tries = 0; tries < 4 && (!pick || pick === lastGesture); tries++) {
          pick = pickWeighted(DAY_PART_GESTURES[part] || DAY_PART_GESTURES.day);
        }
        if (reduceMotion && CALM_GESTURES.indexOf(pick) < 0) {
          const pool = CALM_GESTURES.filter((g) => g !== lastGesture);
          pick = pool[(Math.random() * pool.length) | 0];
        }
        return pick;
      }
      // Start a gesture by name: sets the timing, fires its particles and - 80%
      // of the time - queues the natural follow-up (a wave into a wiggle, a yawn
      // into a stretch), so the idle loop reads like a character instead of a
      // random generator.
      function startGesture(name, now) {
        gesture = name;
        lastGesture = name;
        gestureStart = now;
        gestureUntil = now + (GESTURE_MS[name] || 1100);
        gestureChain = "";
        if (name === "coin") coinCaught = false;
        // A new gesture owns the whole body: the squash and the wobble the last
        // one left behind would otherwise fight it (a spin started right after a
        // landing would not turn).
        landingUntil = 0;
        wobbleStart = 0;
        wobbleUntil = 0;
        if (GESTURE_COMBO[name] && Math.random() < 0.8) {
          gestureChain = GESTURE_COMBO[name];
          gestureNext = gestureUntil + 260 + Math.random() * 520;
        }
        if (name === "wave") {
          particles.push({ type: "emoji", x: 44, y: 30, vx: 0.25, vy: -0.3, size: 10, life: 0, max: 1000, glyph: "👋" });
        } else if (name === "stretch") {
          particles.push({ type: "emoji", x: 44, y: 12, vx: 0.1, vy: -0.2, size: 9, life: 0, max: 900, glyph: "💫" });
        } else if (name === "sneeze") {
          // the "achoo" lands ~60% through the gesture
          setTimeout(() => {
            particles.push({ type: "emoji", x: 44, y: 20, vx: 0.32, vy: -0.18, size: 11, life: 0, max: 800, glyph: "🤧" });
            dust(44);
          }, 420);
        } else if (name === "curious") {
          particles.push({ type: "emoji", x: 44, y: 14, vx: 0.1, vy: -0.2, size: 9, life: 0, max: 900, glyph: "?" });
          dartX = 0; dartY = -1.4; dartUntil = now + 1100; dartNext = now + 1100;
        } else if (name === "wiggle") {
          particles.push({ type: "emoji", x: 44, y: 30, vx: 0.2, vy: -0.25, size: 9, life: 0, max: 900, glyph: "✨" });
        } else if (name === "heart") {
          // a heart floats up off his head on the slow rise
          particles.push({ type: "emoji", x: 44, y: 16, vx: 0.16, vy: -0.42, size: 11, life: 0, max: 1400, glyph: "💚" });
        } else if (name === "giggle") {
          setTimeout(() => {
            particles.push({ type: "emoji", x: 42, y: 16, vx: 0.3, vy: -0.3, size: 9, life: 0, max: 850, glyph: "😄" });
          }, 260);
        } else if (name === "spin") {
          particles.push({ type: "emoji", x: 30, y: 34, vx: 0, vy: -0.12, size: 10, life: 0, max: 900, glyph: "✨" });
        } else if (name === "coin") {
          particles.push({ type: "emoji", x: 44, y: 24, vx: 0.18, vy: -0.24, size: 9, life: 0, max: 700, glyph: "✨" });
        }
      }
      let thoughtNext = performance.now() + 40000 + Math.random() * 40000;
      let sweatNext = performance.now() + 500;
      let hover = false, clickUntil = 0;
      // v1.1.2 touch: being petted, being carried, being tapped.
      // petCharge   - how much stroking he has taken lately; it decays on its own,
      //               so a cursor crossing him never builds any
      // petStroke*  - the raw pointer history used to recognise a stroke
      // petLevel    - 0 = not petted, 1 = blissful, 2 = melted
      // carry*      - the smoothed drag velocity, which drives the swing
      // dizzyUntil  - spiral eyes after a rough ride
      // tickleUntil - the squirm of being tapped one time too many
      // perkUntil   - the short "i noticed you" beat
      let petCharge = 0, petChargeAt = performance.now();
      let petLevel = 0, petStart = 0, petUntil = 0, petHeartNext = 0, petCoolUntil = 0;
      let petStrokeX = null, petStrokeY = null, petStrokeTurns = 0, petStrokeLastSign = 0;
      let petLean = 0, petLeanX = 0;
      // How fast the charge fades (ms), and what it takes to start petting and to
      // melt him. A slow, gentle rub settles below the melt threshold; a brisk one
      // goes straight through it - which is exactly the difference a hand feels.
      const PET_CHARGE_DECAY = 900, PET_TRIGGER = 46, PET_MELT_TRIGGER = 150;
      const PET_MS = 1800, PET_MELT_MS = 2800, PET_COOLDOWN_MS = 4000;
      const TICKLE_MS = 1100, PERK_MS = 1400;
      let boopCount = 0, boopLast = 0, loveFromTapUntil = 0;
      let carryVX = 0, carryVY = 0, carryDist = 0, carryRough = 0;
      let shakeStart = 0, shakeUntil = 0, dizzyUntil = 0, tickleUntil = 0;
      let perkUntil = 0, perkNext = performance.now() + 30000 + Math.random() * 40000;
      // v1.1.2 secondary motion (the difference between a sprite and a body):
      // breathY  - the always-on breathing lift, in px
      // wobble*  - the damped jiggle a landing releases into
      // gazeAhead- 0..1 blend toward "looking where I am walking"
      // lastLid  - what the eyelids were last drawn with (harness reads it)
      let breathY = 0;
      // how long a landing keeps settling, in ms
      const WOBBLE_MS = 480;
      let wobbleStart = 0, wobbleUntil = 0;
      let gazeAhead = 0;
      let lastLid = 0;
      let spookStart = 0, spookUntil = 0, streakNext = performance.now() + 200;
      // v1.1.1: battery-low reaction (Chromium Battery API; graceful no-op elsewhere).
      let batteryLow = false;
      // v1.1.2: a running pomodoro is the one piece of app state that rides on
      // top of him. The ring above his head says how much of the block is left -
      // it is information, not decoration. The main process pushes pet:focus on
      // every phase change, once a minute while a phase runs, and once on load
      // so a pet window created mid-session is not blank.
      let focusState = null;
      let focusLastPhase = "idle";
      let focusNodUntil = 0;

      if (window.pilly && window.pilly.onPetDir) {
        window.pilly.onPetDir((d) => { petDirNow = d === -1 ? -1 : 1; });
      }
      if (window.pilly && window.pilly.onPetCursor) {
        window.pilly.onPetCursor((pos) => { cursor = pos; });
      }
      if (window.pilly && window.pilly.onPetState) {
        window.pilly.onPetState((s) => {
          if (s === "hop") { hopStart = performance.now(); sfx("hop"); }
          if (s === "dance") { confetti(26); sfx("confetti"); }
          if (s === "sleep") sfx("sleep");
          if (s === "eat") {
            eatUntil = performance.now() + 1600;
            sfx("coin");
            particles.push({
              type: "emoji", x: 40, y: 28, vx: 0.25, vy: -0.35,
              size: 11, life: 0, max: 900, glyph: "🪙",
            });
          }
          state = PARAMS[s] ? s : "pause";
        });
      }
      if (window.pilly && window.pilly.onPetTalking) {
        window.pilly.onPetTalking((on) => { talking = !!on; });
      }
      // v1.1.2: he notices when you come back to the app. The main process
      // rate-limits the greeting, and this side stays quiet while he is asleep,
      // busy or already mid-gesture - a pet that waves at every alt-tab stops
      // being charming.
      let greetHoldUntil = 0;
      if (window.pilly && window.pilly.onPetGreet) {
        window.pilly.onPetGreet(() => {
          const now = performance.now();
          if (now < greetHoldUntil || gesture) return;
          if (state === "sleep" || state === "eat" || state === "dance" || state === "hop") return;
          greetHoldUntil = now + 6000;
          startGesture(Math.random() < 0.65 ? "wave" : "peek", now);
          // Don't let an idle gesture land straight on top of the greeting.
          gestureNext = Math.max(gestureNext, gestureUntil + 6000);
        });
      }
      // v1.1.2: focus sessions (see focusState above). He does not celebrate at
      // the start of a block - he gets on with it. He reacts when a block turns
      // into a break (a puff of confetti) and when a break ends (a small nod),
      // which is exactly the rhythm the tray tooltip and the chat already show.
      function applyFocus(p) {
        if (!p || typeof p.phase !== "string") return;
        const phase = p.phase;
        const prev = focusLastPhase;
        focusLastPhase = phase;
        focusState = phase === "idle" ? null : {
          phase,
          remainingMs: Math.max(0, Number(p.remainingMs) || 0),
          totalMs: Math.max(0, Number(p.totalMs) || 0),
          paused: !!p.paused,
        };
        if (phase === prev) return; // same phase - the ring just ticks down
        const now = performance.now();
        if (prev === "focus" && (phase === "break" || phase === "long_break")) {
          bounceStart = now;
          bounceUntil = now + 720;
          confetti(reduceMotion ? 8 : 18);
        } else if (phase === "focus" && prev !== "idle") {
          focusNodUntil = now + 520;
        }
      }
      if (window.pilly && window.pilly.onPetFocus) window.pilly.onPetFocus(applyFocus);
      // v1.1.2: a due reminder is about *you*, so he hops (the state machine
      // forwards "hop") and pops the same glyph the bubble shows.
      if (window.pilly && window.pilly.onPetNudge) {
        window.pilly.onPetNudge((n) => {
          particles.push({
            type: "emoji", x: 30 + (Math.random() - 0.5) * 16, y: 18,
            vx: (Math.random() - 0.5) * 0.2, vy: -0.45,
            size: 12, life: 0, max: 1100, glyph: (n && n.glyph) || "🔔",
          });
        });
      }
      // v1.1.1: watch the battery and droop + warn once per discharge cycle.
      async function batteryPoll() {
        try {
          if (!navigator.getBattery) return;
          const b = await navigator.getBattery();
          const low = !b.charging && b.level < 0.2;
          if (low !== batteryLow) {
            batteryLow = low;
            if (window.pilly && window.pilly.petBattery) {
              window.pilly.petBattery({ low });
            }
          }
        } catch (e) {
          /* ignore - battery API is a nice-to-have */
        }
      }
      batteryPoll();
      setInterval(batteryPoll, 60000);
      // A shared mood overlay used by market data (pet:market) and chat
      // sentiment (pet:mood): happy = confetti + smile + bounce,
      // sad = frown + droopy eyes + a tear.
      function triggerMood(m) {
        const kind = m && m.kind;
        const happy = kind === "up" || kind === "happy";
        const sad = kind === "down" || kind === "sad";
        const love = kind === "love";
        if (!happy && !sad && !love) return;
        market = love ? "love" : happy ? "up" : "down";
        marketUntil = performance.now() + (love ? 2800 : 2400);
        if (love) {
          // heart-eyes + blush + a little flutter of hearts (v1.1.1)
          for (let i = 0; i < 3; i++) {
            setTimeout(() => {
              particles.push({
                type: "emoji", x: 30 + (Math.random() - 0.5) * 22, y: 16,

          tone({ f0: 1760, f1: 1760, dur: 0.18, wave: "sine", gain: 0.03, delay: 0.16 });
        } else if (type === "alert") {
          tone({ f0: 740, f1: 740, dur: 0.1, wave: "square", gain: 0.045 });
          tone({ f0: 740, f1: 740, dur: 0.1, wave: "square", gain: 0.045, delay: 0.16 });
          tone({ f0: 988, f1: 988, dur: 0.2, wave: "square", gain: 0.04, delay: 0.32 });
        } else if (type === "purr") {
          // A purr is a low rumble, not a fanfare: two detuned low tones sliding
          // a little upward into each other.
          tone({ f0: 110, f1: 142, dur: 0.42, wave: "sine", gain: 0.06 });
          tone({ f0: 165, f1: 190, dur: 0.38, wave: "triangle", gain: 0.025, delay: 0.06 });
        } else if (type === "purr2") {
          // Deeper into it: the same rumble with a third voice on top.
          tone({ f0: 130, f1: 176, dur: 0.5, wave: "sine", gain: 0.07 });
          tone({ f0: 196, f1: 240, dur: 0.46, wave: "sine", gain: 0.03, delay: 0.08 });
          tone({ f0: 262, f1: 300, dur: 0.4, wave: "sine", gain: 0.02, delay: 0.16 });
        } else if (type === "boop2") {
          tone({ f0: 880, f1: 1240, dur: 0.09, wave: "sine", gain: 0.05 });
        } else if (type === "tickle") {
          // three quick rising blips - a giggle, not a melody
          tone({ f0: 780, f1: 1040, dur: 0.09, wave: "triangle", gain: 0.05 });
          tone({ f0: 880, f1: 1180, dur: 0.09, wave: "triangle", gain: 0.05, delay: 0.1 });
          tone({ f0: 1040, f1: 1400, dur: 0.12, wave: "triangle", gain: 0.045, delay: 0.2 });
        } else if (type === "sigh") {
          tone({ f0: 420, f1: 300, dur: 0.32, wave: "sine", gain: 0.045 });
          noise(0.14, 0.02, 0.1);
        } else if (type === "thud") {
          tone({ f0: 150, f1: 70, dur: 0.18, wave: "sine", gain: 0.06 });
          noise(0.1, 0.03);
        } else if (type === "dizzy") {
          // a wobbling "whoa": two glides pulling in opposite directions
          tone({ f0: 660, f1: 300, dur: 0.28, wave: "triangle", gain: 0.05 });
          tone({ f0: 300, f1: 620, dur: 0.28, wave: "triangle", gain: 0.04, delay: 0.16 });
          tone({ f0: 620, f1: 260, dur: 0.26, wave: "triangle", gain: 0.035, delay: 0.32 });
        }
      }

      function roundRect(x, y, w, h, r) {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.arcTo(x + w, y, x + w, y + h, r);
        ctx.arcTo(x + w, y + h, x, y + h, r);
        ctx.arcTo(x, y + h, x, y, r);
        ctx.arcTo(x, y, x + w, y, r);
        ctx.closePath();
      }

      // A tiny heart path used for heart-shaped pupils (love mood).
      function heartPath(x, y, s) {
        ctx.beginPath();
        ctx.moveTo(x, y + s * 0.35);
        ctx.bezierCurveTo(x, y, x - s * 0.9, y - s * 0.4, x - s * 0.9, y - s * 0.9);
        ctx.bezierCurveTo(x - s * 0.9, y - s * 1.5, x - s * 0.35, y - s * 1.7, x, y - s * 1.1);
        ctx.bezierCurveTo(x + s * 0.35, y - s * 1.7, x + s * 0.9, y - s * 1.5, x + s * 0.9, y - s * 0.9);
        ctx.bezierCurveTo(x + s * 0.9, y - s * 0.4, x, y, x, y + s * 0.35);
        ctx.closePath();
      }

      // 0 = wide open, 1 = fully shut. Uses a sine so the lid eases in and out
      // instead of popping; the blink cycle is split evenly between the close
      // and the open.
      function blinkAmount(now) {
        if (!blinkStart || now >= blinkUntil) return 0;
        const p = (now - blinkStart) / Math.max(1, blinkUntil - blinkStart);
        if (p <= 0 || p >= 1) return 0;
        return Math.sin(p * Math.PI);
      }

      function drawEye(ex, ey, open, excited, squint, pupilX, pupilY, lid, heart) {
        if (open) {
          if (theme.plush) {
            // button eye: a solid black oval stitched onto the yarn, with a
            // single white glint. No tracking pupil - toys do not eyeball the
            // cursor - but love still lights up a little heart.
            ctx.fillStyle = "#101512";
            ctx.beginPath();
            ctx.ellipse(ex, ey - 0.2, 3.1, 3.8, 0, 0, Math.PI * 2);
            ctx.fill();
            if (heart) {
              ctx.fillStyle = "#f43f5e";
              heartPath(ex + pupilX, ey + pupilY + 0.6, 1.9);
              ctx.fill();
              ctx.fillStyle = "rgba(255,255,255,0.75)";
              ctx.beginPath();
              ctx.arc(ex + pupilX - 0.5, ey + pupilY - 0.9, 0.5, 0, Math.PI * 2);
              ctx.fill();
            } else {
              ctx.fillStyle = "rgba(255,255,255,0.8)";
              ctx.beginPath();
              ctx.arc(ex - 1.1, ey - 1.9, 0.85, 0, Math.PI * 2);
              ctx.fill();
            }
            // eyelid: the yarn color folded over the button when blinking
            const lidH = lid ? lid * 7.6 : squint ? 3 : 0;
            if (lidH > 0) {
              ctx.save();
              ctx.beginPath();
              ctx.ellipse(ex, ey - 0.2, 3.1, 3.8, 0, 0, Math.PI * 2);
              ctx.clip();
              ctx.fillStyle = theme.c2;
              ctx.fillRect(ex - 4, ey - 4.2, 8, lidH + 0.4);
              ctx.restore();
            }
            return;
          }
          ctx.fillStyle = "#0b0f0d";
          roundRect(ex - 3, ey - 3.5, 6, 7, 3);
          ctx.fill();
          if (heart) {
            // heart pupil (love mood) - a rosy heart instead of a white dot
            ctx.fillStyle = "#f43f5e";
            heartPath(ex + pupilX, ey + pupilY + 0.6, 1.9);
            ctx.fill();
            ctx.fillStyle = "rgba(255,255,255,0.75)";
            ctx.beginPath();
            ctx.arc(ex + pupilX - 0.5, ey + pupilY - 0.9, 0.5, 0, Math.PI * 2);
            ctx.fill();
          } else {
            // pupil (white) - follows cursor, bigger when excited
            const pr = excited ? 1.6 : 1.1;
            ctx.fillStyle = "#fff";
            ctx.beginPath();
            ctx.arc(ex + pupilX, ey + pupilY, pr, 0, Math.PI * 2);
            ctx.fill();
          }
          // gloss highlight (pro touch)
          ctx.fillStyle = "rgba(255,255,255,0.55)";
          ctx.beginPath();
          ctx.arc(ex - 1.7, ey - 2, 0.8, 0, Math.PI * 2);
          ctx.fill();
          // eyelid: smooth blink/squeeze, or a droopy lid when sad
          const lidH = lid ? lid * 7 : squint ? 2.8 : 0;
          if (lidH > 0) {
            ctx.fillStyle = "#0b0f0d";
            roundRect(ex - 3, ey - 3.5, 6, lidH, 1);
            ctx.fill();
          }
        } else {
          if (theme.plush) {
            // closed eye: a single stitch instead of a lid line
            ctx.strokeStyle = "#101512";
            ctx.lineWidth = 1.4;
            ctx.lineCap = "round";
            ctx.setLineDash([1.2, 1.2]);
            ctx.beginPath();
            ctx.moveTo(ex - 2.6, ey - 0.4);
            ctx.lineTo(ex + 2.6, ey - 0.4);
            ctx.stroke();
            ctx.setLineDash([]);
            return;
          }
          ctx.strokeStyle = "#0b0f0d";
          ctx.lineWidth = 1.4;
          ctx.beginPath();
          ctx.moveTo(ex - 3, ey);
          ctx.lineTo(ex + 3, ey);
          ctx.stroke();
        }
      }

      // v1.1.2: a happy squint - the "^" eye of a pet that is enjoying itself.
      // Drawing the whole expression is what makes being petted read as bliss
      // instead of as a half-finished blink.
      function drawHappyEye(ex, ey) {
        ctx.strokeStyle = "#0b0f0d";
        ctx.lineWidth = 1.6;
        ctx.lineCap = "round";
        if (theme.plush) ctx.setLineDash([1.2, 1.2]);
        ctx.beginPath();
        ctx.moveTo(ex - 2.9, ey + 1.3);
        ctx.quadraticCurveTo(ex, ey - 2.7, ex + 2.9, ey + 1.3);
        ctx.stroke();
        if (theme.plush) ctx.setLineDash([]);
      }

      // v1.1.2: dizzy eyes after a rough ride - a white spiral instead of a
      // pupil. Cheap to draw and unmistakable even at 30px.
      function drawDizzyEye(ex, ey) {
        ctx.fillStyle = "#0b0f0d";
        roundRect(ex - 3, ey - 3.5, 6, 7, 3);
        ctx.fill();
        ctx.strokeStyle = "#fff";
        ctx.lineWidth = 0.8;
        ctx.beginPath();
        for (let i = 0; i <= 44; i++) {
          const a = (i / 44) * Math.PI * 4.4;
          const r = 0.16 + (i / 44) * 1.9;
          if (i === 0) ctx.moveTo(ex + Math.cos(a) * r, ey + Math.sin(a) * r);
          else ctx.lineTo(ex + Math.cos(a) * r, ey + Math.sin(a) * r);
        }
        ctx.stroke();
      }

      function drawMouth(v, now, mood) {
        // open/close mouth while talking (bubble visible)
        if (talking) {
          const ph = 0.5 + 0.5 * Math.sin((now / 1000) * 24);
          ctx.fillStyle = "#0b0f0d";
          ctx.beginPath();
          ctx.ellipse(0, -4.8, 3 + ph * 1.4, 0.9 + ph * 1.8, 0, 0, Math.PI * 2);
          ctx.fill();
          return;
        }
        if (now < dizzyUntil) {
          // a wobbly "uuurgh" after a rough landing
          ctx.strokeStyle = "#0b0f0d";
          ctx.lineWidth = 1.4;
          ctx.lineCap = "round";
          ctx.beginPath();
          ctx.moveTo(-3.4, -5);
          ctx.quadraticCurveTo(-1.7, -3.8, 0, -5);
          ctx.quadraticCurveTo(1.7, -6.2, 3.4, -5);
          ctx.stroke();
          return;
        }
        if (mood === "bliss") {
          // not the full grin - a slack, contented little smile
          ctx.strokeStyle = "#0b0f0d";
          ctx.lineWidth = 1.5;
          ctx.lineCap = "round";
          ctx.beginPath();
          ctx.moveTo(-3.2, -5.2);
          ctx.quadraticCurveTo(0, -3.4, 3.2, -5.2);
          ctx.stroke();
          return;
        }
        if (mood === "yawn" || mood === "stretch") {
          // big sleepy yawn / stretchy "aaah"
          ctx.fillStyle = "#0b0f0d";
          ctx.beginPath();
          ctx.ellipse(0, -4.8, 3.2, 3.4, 0, 0, Math.PI * 2);
          ctx.fill();
          return;
        }
        if (mood === "scared" || mood === "sneeze") {
          // startled / pre-sneeze little "o"
          ctx.fillStyle = "#0b0f0d";
          ctx.beginPath();
          ctx.ellipse(0, -5, 1.6, 2.2, 0, 0, Math.PI * 2);
          ctx.fill();
          return;
        }
        if (mood === "curious" || mood === "peek") {
          // curious little "o"
          ctx.fillStyle = "#0b0f0d";
          ctx.beginPath();
          ctx.ellipse(0, -5.2, 1.4, 1.8, 0, 0, Math.PI * 2);
          ctx.fill();
          return;
        }
        if (mood === "eat") {
          // chomping mouth while munching a fresh coin
          const ph = 0.5 + 0.5 * Math.sin((now / 1000) * 22);
          ctx.fillStyle = "#0b0f0d";
          ctx.beginPath();
          ctx.ellipse(0, -5, 3, 0.8 + ph * 2.2, 0, 0, Math.PI * 2);
          ctx.fill();
          return;
        }
        ctx.strokeStyle = "#0b0f0d";
        ctx.lineWidth = 1.5;
        ctx.lineCap = "round";
        if (theme.plush) ctx.setLineDash([1.3, 1.1]);
        ctx.beginPath();
        if (mood === "happy" || mood === "love") {
          // smile (love gets the same warm grin, plus heart eyes + blush)
          ctx.moveTo(-4.5, -5.5);
          ctx.quadraticCurveTo(0, -3.2, 4.5, -5.5);
        } else if (mood === "sad") {
          // frown
          ctx.moveTo(-4.5, -4.6);
          ctx.quadraticCurveTo(0, -7.6, 4.5, -4.6);
        } else {
          ctx.moveTo(-4.5, -5.5);
          ctx.quadraticCurveTo(0, -5.5 + v * 3.4, 4.5, -5.5);
        }
        ctx.stroke();
        if (theme.plush) ctx.setLineDash([]);
      }

      // v1.1.2: the coin flip - his own gesture rather than a generic pet trick.
      // He tosses a gold coin, it spins edge over edge, and he catches it with a
      // puff. Geometry only (a disc, a rim, three slanted bars), so it stays
      // crisp at every pet size and costs nothing to draw.
      const COIN_MS = 1250;
      function coinState(now) {
        if (gesture !== "coin" || now >= gestureUntil) return null;
        const p = Math.max(0, Math.min(1, (now - gestureStart) / COIN_MS));
        return {
          p,
          h: Math.sin(p * Math.PI),                                // toss arc: up, then back down
          sx: Math.max(0.12, Math.abs(Math.cos(p * Math.PI * 3))), // three half turns
        };
      }
      function drawCoin(cx, cy, r, sx) {
        ctx.save();
        ctx.translate(cx, cy);
        ctx.scale(sx, 1);
        const g = ctx.createLinearGradient(0, -r, 0, r);
        g.addColorStop(0, "#fde68a");
        g.addColorStop(0.5, "#fbbf24");
        g.addColorStop(1, "#b45309");
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(0, 0, r, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = "rgba(120,53,15,0.5)";
        ctx.lineWidth = 0.7;
        ctx.stroke();
        // the mark on the coin: three slanted bars, drawn as geometry
        ctx.fillStyle = "rgba(9,24,18,0.85)";
        for (let i = 0; i < 3; i++) {
          const ry = -1.9 + i * 1.9;
          const sk = i === 1 ? -r * 0.17 : r * 0.17;
          ctx.beginPath();
          ctx.moveTo(-r * 0.46 + sk, ry - r * 0.14);
          ctx.lineTo(r * 0.46 + sk, ry - r * 0.14);
          ctx.lineTo(r * 0.46 - sk, ry + r * 0.14);
          ctx.lineTo(-r * 0.46 - sk, ry + r * 0.14);
          ctx.closePath();
          ctx.fill();
        }
        ctx.fillStyle = "rgba(255,255,255,0.55)";
        ctx.beginPath();
        ctx.arc(-r * 0.35, -r * 0.45, r * 0.17, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      function drawBody(now) {
        // capsule body
        const grd = ctx.createLinearGradient(0, -23, 0, 0);
        grd.addColorStop(0, theme.c1);
        grd.addColorStop(0.55, theme.c2);
        grd.addColorStop(1, theme.c3);
        ctx.fillStyle = grd;
        roundRect(-20, -23, 40, 23, 11.5);
        ctx.fill();
        // rim
        ctx.strokeStyle = "rgba(0,0,0,0.16)";
        ctx.lineWidth = 1;
        roundRect(-20, -23, 40, 23, 11.5);
        ctx.stroke();
        // top gloss - soft sheen that hugs the forehead, fading at both ends so
        // it never reads as a hard line over the brow (the old flat band did).
        ctx.save();
        roundRect(-20, -23, 40, 23, 11.5);
        ctx.clip();
        const gloss = ctx.createLinearGradient(0, -22, 0, -14);
        gloss.addColorStop(0, "rgba(255,255,255,0)");
        gloss.addColorStop(0.5, "rgba(255,255,255,0.34)");
        gloss.addColorStop(1, "rgba(255,255,255,0)");
        ctx.fillStyle = gloss;
        ctx.fillRect(-20, -22, 40, 8);
        ctx.restore();

        // v1.1.3 plush: crochet rows, a stitched center seam and a yarn belly
        // patch - the brand plush, but still moving, blinking and talking.
        if (theme.plush) {
          ctx.save();
          roundRect(-20, -23, 40, 23, 11.5);
          ctx.clip();
          ctx.strokeStyle = "rgba(5, 72, 78, 0.28)";
          ctx.lineWidth = 0.8;
          ctx.lineCap = "round";
          for (let row = -21; row <= 0; row += 3) {
            ctx.beginPath();
            for (let x = -19; x <= 19; x += 4) {
              ctx.moveTo(x, row + 1.6);
              ctx.lineTo(x + 1.1, row - 0.7);
              ctx.lineTo(x + 2.2, row + 1.6);
            }
            ctx.stroke();
          }
          // belly patch: clipped to the body so it reads as a yarn patch and
          // never pokes out below him - the old patch hung 4px past the rounded
          // bottom as a semi-transparent nub.
          ctx.fillStyle = "rgba(255,255,255,0.14)";
          ctx.beginPath();
          ctx.ellipse(0, -4.5, 9.5, 8.5, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
          // center seam: one dashed stitch over the top of the head
          ctx.strokeStyle = "rgba(5, 72, 78, 0.55)";
          ctx.lineWidth = 1;
          ctx.lineCap = "round";
          ctx.setLineDash([1.7, 1.5]);
          ctx.beginPath();
          ctx.moveTo(0, -21.5);
          ctx.quadraticCurveTo(1.4, -17.5, 0, -14);
          ctx.stroke();
          ctx.setLineDash([]);
        }

        // face
        let mood = defaultMood;
        if (now < marketUntil) mood = market;
        // v1.1.2: being petted outranks everything except a live market move, and
        // it is said with the face - squinting eyes, blush, a small slack smile -
        // not only with the sway of the body.
        else if (blissLevel(now)) mood = "bliss";
        else if (gesture === "yawn" && now < gestureUntil) mood = "yawn";
        else if (gesture === "stretch" && now < gestureUntil) mood = "stretch";
        else if (gesture === "sneeze" && now < gestureUntil) mood = "sneeze";
        else if (gesture === "peek" && now < gestureUntil) mood = "peek";
        else if (gesture === "wave" && now < gestureUntil) mood = "happy";
        else if (gesture === "wiggle" && now < gestureUntil) mood = "happy";
        else if (gesture === "giggle" && now < gestureUntil) mood = "happy";
        else if (gesture === "spin" && now < gestureUntil) mood = "happy";
        else if (gesture === "heart" && now < gestureUntil) mood = "love";
        else if (gesture === "curious" && now < gestureUntil) mood = "curious";
        else if (state === "flee") mood = "scared";
        else if (state === "eat" && now < eatUntil) mood = "eat";
        else if (batteryLow) mood = "sad"; // v1.1.1: droopy when the battery is low
        const heartEyes = mood === "love";
        // v1.1.2: eyelids move smoothly instead of snapping open/shut - a hard
        // cut reads as a glitch at 60fps, an eased lid reads as a real blink.
        let squeeze = 0;
        if (gesture && now < gestureUntil && (gesture === "yawn" || gesture === "stretch" || gesture === "sneeze")) {
          const gp = (now - gestureStart) / Math.max(1, gestureUntil - gestureStart);
          squeeze = Math.sin(gp * Math.PI); // squeezed shut mid-gesture
        }
        const eyesOpen = cur.eyes === 1;
        const lidAmt = Math.max(blinkAmount(now), squeeze);
        const eyeY = -14.5;
        // v1.1.2: a droopy lid when the market is red or the battery is low, plus
        // the night droop - but never while he is excited or talking, because a
        // pet that looks half asleep while answering you is just broken.
        const droop = (((now < marketUntil && market === "down") || batteryLow) ? 0.6 : 0)
          + (face.excited || talking ? 0 : nightDroop());
        const lid = Math.min(1, Math.max(droop, lidAmt));
        lastLid = lid;
        // v1.1.2: three more faces live here. Being petted, being tickled and
        // being dropped all change the eyes, and they outrank the normal pupil
        // drawing: tracking the cursor through a giggle looks like nothing
        // happened at all.
        const dizzyNow = now < dizzyUntil;
        const blissNow = blissLevel(now) > 0;
        const pleasedEyes = blissNow || now < tickleUntil || (gesture === "giggle" && now < gestureUntil);
        if (!eyesOpen) {
          drawEye(-11, eyeY, false, false, false, 0, 0, 0, false);
          drawEye(9, eyeY, false, false, false, 0, 0, 0, false);
        } else if (dizzyNow) {
          drawDizzyEye(-11, eyeY);
          drawDizzyEye(9, eyeY);
        } else if (pleasedEyes) {
          drawHappyEye(-11, eyeY);
          drawHappyEye(9, eyeY);
        } else {
          drawEye(-11, eyeY, true, face.excited, face.squint, face.px, face.py, lid, heartEyes);
          drawEye(9, eyeY, true, face.excited, face.squint, face.px, face.py, lid, heartEyes);
        }
        if (heartEyes || blissNow) {
          // blush
          ctx.fillStyle = "rgba(244, 63, 94, 0.30)";
          ctx.beginPath();
          ctx.ellipse(-14, -9.5, 3.1, 1.7, 0, 0, Math.PI * 2);
          ctx.ellipse(14, -9.5, 3.1, 1.7, 0, 0, Math.PI * 2);
          ctx.fill();
        }
        if (cur.annoyed) {
          ctx.strokeStyle = "#0b0f0d";
          ctx.lineWidth = 1.6;
          ctx.beginPath();
          ctx.moveTo(-17, -22.5); ctx.lineTo(-6, -19.5);
          ctx.moveTo(17, -22.5); ctx.lineTo(6, -19.5);
          ctx.stroke();
        }
        drawMouth(cur.mouth, now, mood);
      }

      // v1.1.2: the focus ring. A thin ring above his head drains as the current
      // phase runs out, with the minutes left in the middle; amber and slowly
      // pulsing in the final minute (a cue you can ignore, not a popup), blue on
      // a break, and "paused" while the block is held. It floats with him
      // (bodyY * 0.3) so a hop does not leave it behind, and it is scaled to stay
      // inside the window at every pet size. Returns what it drew - the animation
      // harness checks the maths instead of sampling pixels.
      function drawFocusRing(now, bodyY) {
        const f = focusState;
        if (!f) return null;
        const pct = f.totalMs > 0 ? Math.max(0, Math.min(1, 1 - f.remainingMs / f.totalMs)) : 1;
        const onBreak = f.phase !== "focus";
        const lastMin = !onBreak && !f.paused && f.remainingMs <= 60000;
        const color = onBreak ? "#38bdf8" : lastMin ? "#fbbf24" : theme.c1;
        const cx = 30;
        const cy = 13 + bodyY * 0.3;
        const r = 7;
        ctx.save();
        ctx.lineWidth = 2.2;
        ctx.lineCap = "round";
        ctx.strokeStyle = "rgba(255,255,255,0.18)";
        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, Math.PI * 2);
        ctx.stroke();
        ctx.strokeStyle = color;
        if (lastMin && !reduceMotion) ctx.globalAlpha = 0.6 + 0.4 * (0.5 + 0.5 * Math.sin(now / 220));
        ctx.beginPath();
        ctx.arc(cx, cy, r, -Math.PI / 2, -Math.PI / 2 + pct * Math.PI * 2);
        ctx.stroke();
        ctx.globalAlpha = 1;
        ctx.fillStyle = color;
        ctx.font = "bold 8px system-ui, sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        const label = f.paused ? "❚❚" : String(Math.max(1, Math.ceil(f.remainingMs / 60000)));
        ctx.fillText(label, cx, cy + 0.5);
        ctx.restore();
        return { phase: f.phase, pct, label, color, paused: f.paused, cy };
      }

      function draw(now, dt) {
        ctx.clearRect(0, 0, W, H);
        const t = now / 1000;
        // Blink: a living pet blinks. Occasional slow blink for a natural beat.
        if (cur.eyes === 1 && now > blinkNext) {
          const slow = Math.random() < 0.2;
          blinkStart = now;
          blinkUntil = now + (slow ? 300 : 140);
          blinkNext = now + (slow ? 1500 : 2200) + Math.random() * (slow ? 2400 : 3400);
          // v1.1.2: sometimes follow with a quick second blink - extra life.
          blinkAgainAt = Math.random() < 0.22 ? blinkUntil + 170 : 0;
        } else if (blinkAgainAt && now > blinkAgainAt) {
          blinkAgainAt = 0;
          blinkStart = now;
          blinkUntil = now + 100;
        }
        const base = dragOverride.active ? PARAMS.drag : (PARAMS[state] || PARAMS.pause);
        const k = 1 - Math.exp((-dt / 1000) * 9);
        // v1.1.2: being petted overrides the resting shape of the current state
        // instead of pushing against it. Two ease-toward-target systems on the same
        // value settle in the middle of both, so the melt used to reach only about
        // a third of its squash; this way every frame eases straight to the petted
        // shape (a second, final blend further down catches the states that assign
        // squX/squY outright). Petting is ignored while asleep - waking up is a
        // separate event - and while carried: you cannot rub a pet already in the
        // air.
        const bliss = blissLevel(now);
        const petBase = bliss
          ? { squX: bliss === 2 ? 1.16 : 1.08, squY: bliss === 2 ? 0.86 : 0.93, mouth: base.mouth, tilt: 0, annoyed: false, eyes: 1 }
          : base;
        cur.squX += (petBase.squX - cur.squX) * k;
        cur.squY += (petBase.squY - cur.squY) * k;
        cur.mouth += (petBase.mouth - cur.mouth) * k;
        cur.tilt += (petBase.tilt - cur.tilt) * k;
        // v1.1.2: only look annoyed mid-drag after a real drag (a quick click
        // must stay a friendly boop, not a scowl flash).
        cur.annoyed = dragOverride.active ? dragAnnoyed : base.annoyed;
        cur.eyes = base.eyes;

        // vertical bob / rotation per state
        let bodyY = 0, rot = 0;
        if (state === "walk") {
          // step phase: bob + rocking + subtle squash-stretch
          const ph = Math.sin(t * 9);
          bodyY = -Math.abs(ph) * 3.4;
          rot = Math.sin(t * 4.5) * 0.06;
          cur.squX = 1 + 0.05 * Math.sin(t * 18);
          cur.squY = 1 - 0.04 * Math.sin(t * 18);
        } else if (state === "dance") {
          bodyY = -Math.abs(Math.sin(t * 13)) * 4.5;
          rot = Math.sin(t * 7) * 0.13;
        } else if (state === "pause") {
          bodyY = -Math.abs(Math.sin(t * 2.1)) * 1.4; // breathe
          rot = Math.sin(t * 0.7) * 0.04; // gentle idle sway while hanging out
        } else if (state === "sleep") {
          bodyY = Math.sin(t * 0.9) * 1.6; // slow, deep breathing
          cur.tilt = 0.05; // sleepy tilt
        } else if (state === "flee") {
          bodyY = -Math.abs(Math.sin(t * 20)) * 5; // panicked scurry
          rot = Math.sin(t * 9) * 0.1;
        } else if (state === "eat") {
          // munching: little bounce + squash in rhythm with the chomp
          const ph = Math.sin(t * 22);
          bodyY = -Math.abs(ph) * 1.8;
          cur.squX = 1 + 0.05 * ph;
          cur.squY = 1 - 0.06 * ph;
        } else if (state === "hop" && now - hopStart < HOP_MS) {
          // v1.1.2: anticipation crouch, an uncoil into a stretch off the
          // ground, neutral at the apex, then a squash on the way down. The
          // squash is anchored at the feet, so he coils instead of floating.
          const p = (now - hopStart) / HOP_MS;
          const kf = hopShapeAt(p, hopKf);
          cur.squX = kf.x;
          cur.squY = kf.y;
          const q = Math.max(0, (p - HOP_ANTIC) / (1 - HOP_ANTIC));
          bodyY = -Math.sin(q * Math.PI) * 18;
          if (q > 0.85) dust(30);
          if (q >= 0.97) landingUntil = now + 170;
        }
        // v1.1.2: he breathes in every state, not only while parked. A sprite
        // that only moves when something happens reads as a slideshow; a slow
        // chest rise in the background is what makes him look alive while you
        // work. It is faster when he is busy, and it is off while you are
        // holding him or when the OS asked for less motion.
        if (state !== "pause" && state !== "sleep" && !dragOverride.active && !reduceMotion) {
          const busy = state === "walk" || state === "eat" || state === "dance" || state === "flee";
          breathY = Math.sin(t * (busy ? 3.6 : 2.2)) * (busy ? 0.5 : 0.65);
          bodyY -= Math.abs(breathY);
          // The chest rise must never fight a body that something else is already
          // shaping: the hop keyframes and the gesture branches assign the squash
          // directly, and easing over them would flatten them (the hop's airborne
          // stretch) or fight them frame by frame.
          if (!busy && state !== "hop" && !gesture) cur.squY += ((1 + breathY * 0.02) - cur.squY) * k;
        } else {
          breathY = 0;
        }
        // happy bounce when the market goes green
        if (now < bounceUntil) {
          const p = (now - bounceStart) / 720;
          bodyY -= Math.sin(p * Math.PI) * 7;
        }
        // spooked jump when the cursor pokes Pilly
        if (now < spookUntil) {
          const p = (now - spookStart) / 420;
          bodyY -= Math.sin(p * Math.PI) * 10;
        }
        // v1.1.2: back to work - a small, deliberate nod when a break ends.
        if (now < focusNodUntil) {
          const w = Math.sin(((focusNodUntil - now) / 520) * Math.PI);
          bodyY += w * 1.6;
          rot += w * 0.05;
        }
        // v1.1.2: carried. He lags behind your hand and swings from it - a held
        // body reads as heavy because of the pendulum, not because of the offset.
        // carryVX/VY are your real mouse deltas, smoothed; they decay here so a
        // stopped hand stops the swing instead of leaving him leaning forever.
        carryVX *= Math.exp(-dt / 90);
        carryVY *= Math.exp(-dt / 90);
        if (dragOverride.active) {
          const lean = Math.max(-1, Math.min(1, carryVX / 12));
          bodyY += 0.8 + Math.min(2.2, Math.abs(carryVY) * 0.03); // he hangs a little lower
          rot += lean * 0.18 * petDirNow;                          // and trails the hand
          rot += Math.sin(t * 6.5) * 0.03 * Math.abs(lean);
        } else if (shakeStart && now < shakeUntil) {
          // shaking off a rough landing: a fast, damped side-to-side. The decay is
          // what makes it read as "put me down properly" rather than as a wobble.
          const age = (now - shakeStart) / Math.max(1, shakeUntil - shakeStart);
          const w = Math.sin(age * Math.PI * 9) * (1 - age);
          rot += w * 0.13;
          cur.squX *= 1 + 0.04 * w;
        } else if (shakeStart) {
          shakeStart = 0;
        }
        // v1.1.2: being petted. He leans into the hand while it moves, and purrs -
        // a vibration you can see: a tiny high-frequency rock, deliberately under
        // one degree, so it reads as contentment and not as a tremble.
        if (bliss) {
          const w = Math.min(1, (now - petStart) / 260); // eased in, then held
          petLean += (petLeanX - petLean) * Math.min(1, (dt / 1000) * 6);
          rot += petLean * (bliss === 2 ? 0.1 : 0.07) * w * petDirNow;
          rot += Math.sin(t * (bliss === 2 ? 26 : 18)) * (bliss === 2 ? 0.018 : 0.01) * w;
          bodyY -= (bliss === 2 ? 1.6 : 0.9) * w;
          if (now > petHeartNext) {
            petHeartNext = now + (bliss === 2 ? 300 : 520);
            heartPuff(0, bliss === 2 ? 9 : 7);
          }
        } else if (petUntil) {
          // A petted pet settles, he does not simply stop: one last heart floats
          // off and the shared landing squash takes over. Then he is left alone for
          // a while, so affection cannot be farmed by wiggling the mouse - an
          // instant response to every twitch would read as a lever, not as a pet.
          petUntil = 0;
          petLevel = 0;
          petCharge = 0;
          resetStroke();
          petCoolUntil = now + PET_COOLDOWN_MS;
          landingUntil = now + 170;
          heartPuff(0, 8);
          sfx("sigh");
        }
        // v1.1.2 fix: retire a finished gesture. Without this the picker's
        // "nothing else playing" guard latched on the first idle gesture and
        // he would only ever perform one gesture per session.
        if (gesture && now >= gestureUntil) gesture = "";
        // v1.1.2: wind-up. A gesture that starts at full amplitude on its first
        // frame looks like the clip was cut in half, so the first 18% of every idle
        // clip is spent coiling back before the move. The hop has had its own
        // anticipation for a while - this is the same idea for the rest.
        if (gesture && now < gestureUntil && !dragOverride.active && !bliss) {
          const wp = (now - gestureStart) / Math.max(1, gestureUntil - gestureStart);
          if (wp < 0.18) {
            const a = Math.sin((wp / 0.18) * Math.PI * 0.5);
            bodyY += a * 1.5;
            rot -= a * 0.07 * petDirNow;
          }
        }
        // waving: gentle rock side to side
        if (gesture === "wave" && now < gestureUntil) rot += Math.sin(t * 6) * 0.08;
        // wiggle: quick excited shimmy
        if (gesture === "wiggle" && now < gestureUntil) rot += Math.sin(t * 20) * 0.12;
        // curious: slow, thoughtful sway
        if (gesture === "curious" && now < gestureUntil) rot += Math.sin(t * 1.6) * 0.04;
        // v1.1.2: talking - a gentle, attentive bob while the bubble is up.
        if (talking && state !== "walk" && state !== "dance") {
          rot += Math.sin(t * 5) * 0.025;
          bodyY -= Math.abs(Math.sin(t * 5)) * 0.7;
        }
        // v1.1.2: stretch - full-body rise and reach, then relax.
        if (gesture === "stretch" && now < gestureUntil) {
          const gp = (now - gestureStart) / Math.max(1, gestureUntil - gestureStart);
          const w = Math.sin(gp * Math.PI);
          bodyY -= w * 2.4;
          cur.squY += ((1 + 0.11 * w) - cur.squY) * k;
          cur.squX += ((1 - 0.07 * w) - cur.squX) * k;
        }
        // v1.1.2: sneeze - a quick little "achoo" head-shake.
        if (gesture === "sneeze" && now < gestureUntil) {
          const gp = (now - gestureStart) / Math.max(1, gestureUntil - gestureStart);
          const w = Math.sin(gp * Math.PI);
          rot += Math.sin(gp * Math.PI * 2) * 0.06;
          bodyY -= w * 2.0;
        }
        // v1.1.2: peek - glance left, then right, with a slight lean.
        if (gesture === "peek" && now < gestureUntil) {
          const gp = (now - gestureStart) / Math.max(1, gestureUntil - gestureStart);
          rot += Math.sin(gp * Math.PI * 2) * 0.07;
        }
        // v1.1.2: heart - a proud little rise with a heartbeat pulse.
        if (gesture === "heart" && now < gestureUntil) {
          const gp = (now - gestureStart) / Math.max(1, gestureUntil - gestureStart);
          const w = Math.sin(gp * Math.PI);
          bodyY -= w * 1.8;
          const beat = Math.sin(gp * Math.PI * 6);
          cur.squX += ((1 + 0.05 * beat * w) - cur.squX) * k;
          cur.squY += ((1 + 0.035 * beat * w) - cur.squY) * k;
        }
        // v1.1.2: giggle - a bouncy little laugh.
        if (gesture === "giggle" && now < gestureUntil) {
          const gp = (now - gestureStart) / Math.max(1, gestureUntil - gestureStart);
          const w = Math.sin(gp * Math.PI);
          bodyY -= Math.abs(Math.sin(gp * Math.PI * 5)) * 2.6 * w;
          rot += Math.sin(gp * Math.PI * 5) * 0.05 * w;
        }
        // v1.1.2: spin - a quick pirouette. Squashing X through zero fakes the
        // turn on a sprite that has no depth.
        if (gesture === "spin" && now < gestureUntil) {
          const gp = (now - gestureStart) / Math.max(1, gestureUntil - gestureStart);
          cur.squX = Math.max(0.14, Math.abs(Math.cos(gp * Math.PI * 2)));
          rot += Math.sin(gp * Math.PI * 2) * 0.06;
        }
        // v1.1.2: the coin flip - he rises a little with the toss, follows the
        // coin up with his eyes, and the catch squashes him (via the landing
        // squash below) with a puff of gold.
        const coin = coinState(now);
        if (coin) {
          bodyY -= coin.h * 1.8;
          if (coin.p > 0.9 && !coinCaught) {
            coinCaught = true;
            landingUntil = now + 170;
            sfx("coin");
            for (let i = 0; i < 5; i++) {
              particles.push({
                type: "confetti",
                x: 30 + (Math.random() - 0.5) * 26,
                y: 34,
                vx: (Math.random() - 0.5) * 1.1,
                vy: -0.2 - Math.random() * 0.5,
                rot: Math.random() * Math.PI,
                vr: (Math.random() - 0.5) * 0.5,
                size: 1.5 + Math.random() * 1.3,
                color: "#fbbf24",
                life: 0,
                max: 480 + Math.random() * 220,
              });
            }
          }
        }
        // v1.1.2: when the cursor comes really close, he leans away a hair -
        // the difference between "a sprite" and "something that noticed you".
        // 0.11 rad is ~2.5px of head travel at the default size: readable, still
        // shy rather than theatrical.
        if (!dragOverride.active && state !== "flee" && state !== "sleep" && !bliss && !(now < tickleUntil)) {
          const near = Math.hypot(cursor.x, cursor.y);
          if (near < 36) rot -= (1 - near / 36) * 0.11 * (cursor.x < 0 ? -1 : 1) * petDirNow;
        }
        // soft landing squash after the hop
        if (now < landingUntil) {
          const landK = (landingUntil - now) / 170;
          const k2 = 1 - Math.exp((-dt / 1000) * 16);
          cur.squX += (1 + 0.16 * landK - cur.squX) * k2;
          cur.squY += (1 - 0.15 * landK - cur.squY) * k2;
          // v1.1.2: the squash releases into a short damped wobble instead of
          // just stopping. Weight, not decoration: the follow-through is what
          // separates an animation from a sprite swap.
          wobbleStart = landingUntil;
          wobbleUntil = landingUntil + WOBBLE_MS;
        } else if (wobbleStart && now < wobbleUntil) {
          // Assigned, not eased: the envelope is a function of the absolute age,
          // so the settle is identical at 30 and at 144 fps. Easing it instead
          // filters the oscillation down to a fraction of a pixel (invisible).
          // The age is clamped so a non-monotonic clock can never turn the
          // settle into a huge body distortion.
          const age = Math.min(1, Math.max(0, (now - wobbleStart) / WOBBLE_MS));
          const w = Math.sin(age * Math.PI * 3) * Math.exp(-age * 3.4) * 0.055;
          cur.squX = 1 + w;
          cur.squY = 1 - w;
        } else if (wobbleStart) {
          wobbleStart = 0;
          wobbleUntil = 0;
        }
        // gentle squash while the cursor hovers over Pilly
        if (hover && state !== "drag" && !bliss && !(now < marketUntil) && !(gesture === "wave" && now < gestureUntil) && !(now < tickleUntil)) {
          cur.squX += (1.07 - cur.squX) * k;
          cur.squY += (0.95 - cur.squY) * k;
        }
        // quick tap squish on click
        if (now < clickUntil) {
          const p = (clickUntil - now) / 180;
          cur.squX += (1 + 0.18 * p - cur.squX) * k;
          cur.squY += (1 - 0.16 * p - cur.squY) * k;
        }
        // v1.1.2: tickled - a squirm, not a giggle. He twists side to side and
        // shivers, because being tickled is funny *and* annoying rather than purely
        // happy, and the two reactions must not look like the same animation. This
        // sits after the tap squish on purpose: the wobble has to survive it.
        if (now < tickleUntil) {
          const tw = Math.min(1, (tickleUntil - now) / 500);
          rot += Math.sin(t * 24) * 0.1 * tw;
          bodyY -= Math.abs(Math.sin(t * 12)) * 0.8 * tw;
          cur.squX *= 1 + Math.sin(t * 24 + 1.2) * 0.03 * tw;
          cur.squY *= 1 - Math.abs(Math.sin(t * 12)) * 0.02 * tw;
        }
        // v1.1.2: a perk. Every 30-70s he pulls himself up straight for a moment,
        // as if something just caught his eye, and settles back. Short, rare and
        // free - the cheapest way to keep a long idle window from looking asleep.
        // Deferred while asleep, carried, talking or mid-gesture, and skipped for a
        // few seconds instead of being skipped for another 30.
        const perkPw = now < perkUntil
          ? Math.sin(Math.min(1, Math.max(0, 1 - (perkUntil - now) / PERK_MS)) * Math.PI)
          : 0;
        if (now < perkUntil) {
          bodyY -= perkPw * 2.1;
          rot += perkPw * 0.05 * petDirNow;
        } else if (perkUntil) {
          perkUntil = 0;
        } else if (now > perkNext) {
          const free = state !== "sleep" && !dragOverride.active && !talking && !gesture && now >= marketUntil && !bliss;
          if (free) perkUntil = now + PERK_MS;
          else perkNext = now + 5000;
        }
        // v1.1.2: the petted shape gets the last word. The walk cycle, the spin and
        // the landing all assign squX/squY outright, so a pet that is mid-stroll
        // would otherwise lose the melt for as long as he keeps walking. Blending
        // again here keeps the melt at very nearly full depth and still leaves a
        // trace of the shimmy underneath it - which is what a hand on a waddling
        // pet actually feels like.
        if (bliss) {
          const kb = 1 - Math.exp((-dt / 1000) * 22);
          cur.squX += (petBase.squX - cur.squX) * kb;
          cur.squY += (petBase.squY - cur.squY) * kb;
        }
        // The perk's stretch is applied to the drawing scale and not to cur.squY:
        // a multiply on the eased value re-feeds the ease every frame and compounds
        // into a half-again-taller pet, which reads as a rendering glitch rather
        // than as a pet noticing you. Applied once, at draw time, it stays a hair.
        const perkStretch = 1 + perkPw * 0.05;

        // occasional idle gestures while hanging out (v1.1.2: wave / yawn /
        // stretch / peek / curious / sneeze / wiggle / heart / giggle / spin /
        // coin - see GESTURE_MS and DAY_PART_GESTURES for the live set)
        if ((state === "pause" || state === "walk") && now > gestureNext && !talking && now >= marketUntil && !gesture && !bliss && !dragOverride.active && !(now < tickleUntil) && !(now < perkUntil)) {
          // v1.1.2: how long until the next idle moment depends on the hour -
          // he is quickest in the morning and lazy late at night - and a running
          // focus block stretches it further. The point of a pomodoro is that he
          // leaves you alone while it runs.
          const part = dayPart();
          const focusQuiet = focusState && focusState.phase === "focus" && !focusState.paused ? 1.5 : 1;
          gestureNext = now + (14000 + Math.random() * 14000) * (DAY_PART_PACE[part] || 1) * focusQuiet;
          startGesture(pickIdleGesture(part), now);
        }
        // Stage 6: occasional random moods / thought bubbles while hanging out
        if ((state === "pause" || state === "walk") && now > thoughtNext && !talking && now >= marketUntil && !gesture && !bliss && !dragOverride.active && !(now < tickleUntil)) {
          thoughtNext = now + 40000 + Math.random() * 45000;
          if (Math.random() < 0.6) {
            market = Math.random() < 0.5 ? "up" : "down";
            marketUntil = now + 2200;
          } else {
            const thoughts = ["💭", "🤔", "😌", "✨", "😏", "🫠"];
            particles.push({
              type: "emoji", x: 44, y: 16,
              vx: 0.2, vy: -0.3, size: 9,
              life: 0, max: 1100,
              glyph: thoughts[(Math.random() * thoughts.length) | 0],
            });
            sfx("question");
          }
        }
        // idle eye-dart (pause only): pupils glance around sometimes
        if (state === "pause" && now > dartNext) {
          dartX = (Math.random() - 0.5) * 2.2;
          dartY = (Math.random() - 0.5) * 1.4;
          dartUntil = now + 260;
          dartNext = now + 3200 + Math.random() * 4000;
        }
        const useDart = now < dartUntil;
        const cursorDist = Math.hypot(cursor.x, cursor.y);
        const alert = state !== "flee" && state !== "sleep" && cursorDist < 95;
        const peeking = gesture === "peek" && now < gestureUntil;
        const excited = state === "dance" || state === "flee" || alert || talking || peeking || (now < marketUntil && market === "up") || now < perkUntil || !!bliss;
        const squint = cur.annoyed;
        // v1.1.2: while peeking, pupils sweep side to side instead of tracking.
        const peekShift = peeking ? Math.sin(((now - gestureStart) / Math.max(1, gestureUntil - gestureStart)) * Math.PI * 2) * 1.5 : 0;
        // v1.1.2: while he is walking and you are nowhere near him, his pupils
        // look where he is going instead of tracking a cursor he cannot see.
        // The blend eases in over ~0.3s, so crossing the threshold never reads
        // as a twitch.
        const wantsAhead = state === "walk" && cursorDist > 220 && !useDart && !peeking && !talking;
        gazeAhead += ((wantsAhead ? 1 : 0) - gazeAhead) * Math.min(1, (dt / 1000) * 6);
        let cx = useDart ? dartX : (peekShift ? peekShift : Math.max(-1.2, Math.min(1.2, (cursor.x / 120) * 1.2))) * petDirNow;
        cx = cx * (1 - gazeAhead) + 0.85 * petDirNow * gazeAhead;
        const cy = useDart ? dartY : Math.max(-1.2, Math.min(1.2, (cursor.y / 120) * 1.2));
        face.px = cx; face.py = cy; face.excited = excited; face.squint = squint;
        // The two values the verification harness reads to prove that the touch
        // animations really moved him: rotation and vertical offset are locals of
        // draw(), and a pixel count cannot tell a lean from a breath.
        face.rot = rot; face.bodyY = bodyY; face.squY = cur.squY * perkStretch;

        // soft radial shadow (pro, scales with jump height)
        const shScale = Math.max(0.4, 1 - (bodyY / 40) * 0.65);
        // v1.1.2: the shadow follows the silhouette instead of floating at a fixed
        // width. A pet that melts into a pancake while his shadow stays the same
        // size looks pasted onto the desktop, and so does a pirouette.
        const shW = shScale * Math.max(0.78, Math.min(1.28, 0.55 + cur.squX * 0.45));
        ctx.save();
        ctx.translate(30, 62);
        ctx.scale(shW, 0.25 * shScale);
        const g = ctx.createRadialGradient(0, 0, 1, 0, 0, 16);
        g.addColorStop(0, "rgba(0,0,0,0.5)");
        g.addColorStop(1, "rgba(0,0,0,0)");
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(0, 0, 16, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        // v1.1.2: birth pop-in - Pilly springs onto the taskbar with a little
        // overshoot and a puff of dust.
        let pop = 1;
        if (now - bornAt < 640) {
          const p = (now - bornAt) / 640;
          const ease = 1 - Math.pow(1 - p, 3);
          pop = 0.72 + 0.28 * ease + 0.1 * Math.sin(p * Math.PI) * (1 - p);
          if (!birthDustDone && p > 0.4) { birthDustDone = true; dust(30); }
        }

        // pill (mirrored by direction)
        ctx.save();
        ctx.translate(30, 53 + bodyY);
        ctx.scale(petDirNow, 1);
        ctx.rotate(rot);
        ctx.scale(cur.squX * ps * pop, cur.squY * perkStretch * ps * pop);
        drawBody(now);
        ctx.restore();

        // v1.1.2: the coin flip rides in front of him, anchored to the top of his
        // head so it tracks his size, his hops and the breathing.
        if (coin) {
          const bodyTop = 53 + bodyY - 23 * ps;
          drawCoin(30 + petDirNow * 2 * ps, bodyTop - 7 - coin.h * 20 * ps, 5 * ps, coin.sx);
        }

        // v1.1.1: a little battery badge while the laptop is running low.
        if (batteryLow) {
          ctx.font = "10px sans-serif";
          ctx.textAlign = "center";
          ctx.textBaseline = "alphabetic";
          ctx.fillText("🔋", 30, 22 + bodyY);
        }

        // v1.1.2: the focus ring, drawn last so nothing he does can hide the one
        // piece of real app state he carries.
        drawFocusRing(now, bodyY);
      }

      function updateParticles(now, dt) {
        // spawn zzz while sleeping
        if (state === "sleep" && now > zzNext) {
          zzNext = now + 650 + Math.random() * 500;
          particles.push({
            type: "zz",
            x: 17, y: 20,
            vx: 0.25, vy: -0.35,
            size: 6 + Math.random() * 4,
            life: 0, max: 1300,
          });
        }
        // music notes while dancing
        if (state === "dance" && now > noteNext) {
          noteNext = now + 420 + Math.random() * 500;
          particles.push({
            type: "note",
            x: 30 + (Math.random() - 0.5) * 30,
            y: 8 + Math.random() * 14,
            vx: (Math.random() - 0.5) * 0.5,
            vy: -0.6 - Math.random() * 0.5,
            size: 7 + Math.random() * 4,
            life: 0, max: 900,
            glyph: Math.random() < 0.5 ? "♪" : "♫",
          });
        }
        // sweat drop while fleeing the cursor
        if (state === "flee" && now > sweatNext) {
          sweatNext = now + 380;
          particles.push({ type: "sweat", x: 44, y: 36, vx: 0.1, vy: 0.35, size: 1.6, life: 0, max: 500 });
        }
        // motion streaks while sprinting away
        if (state === "flee" && now > streakNext) {
          streakNext = now + 90;
          const dir = petDirNow;
          particles.push({
            type: "streak",
            x: 30 - dir * 13,
            y: 38 + (Math.random() - 0.5) * 18,
            vx: -dir * 1.6,
            vy: 0,
            size: 1.5 + Math.random() * 1.5,
            life: 0, max: 200,
          });
        }
        // gold crumbs while munching a fresh coin
        if (state === "eat" && now < eatUntil && now > crumbNext) {
          crumbNext = now + 130;
          particles.push({
            type: "confetti",
            x: 30 + (Math.random() - 0.5) * 24,
            y: 24 + Math.random() * 12,
            vx: (Math.random() - 0.5) * 0.7,
            vy: 0.15 + Math.random() * 0.3,
            rot: Math.random() * Math.PI,
            vr: (Math.random() - 0.5) * 0.4,
            size: 1.6 + Math.random() * 1.4,
            color: "#fbbf24",
            life: 0,
            max: 420 + Math.random() * 260,
          });
        }
        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          p.life += dt;
          p.x += p.vx;
          p.y += p.vy;
          if (p.type !== "zz" && p.vy < 1.4) p.vy += 0.02;
          if (p.vr) p.rot += p.vr;
          const a = Math.max(0, 1 - p.life / p.max);
          if (p.type === "confetti") {
            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.rotate(p.rot);
            ctx.globalAlpha = a;
            ctx.fillStyle = p.color;
            ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.6);
            ctx.restore();
          } else if (p.type === "dust") {
            ctx.globalAlpha = a * 0.5;
            ctx.fillStyle = "#999";
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            ctx.fill();
            ctx.globalAlpha = 1;
          } else if (p.type === "zz") {
            ctx.save();
            ctx.globalAlpha = a;
            ctx.fillStyle = theme.c2;
            ctx.font = p.size + "px sans-serif";
            ctx.fillText("z", p.x, p.y);
            ctx.restore();
          } else if (p.type === "tear") {
            ctx.globalAlpha = a;
            ctx.fillStyle = "#7dd3fc";
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            ctx.fill();
            ctx.globalAlpha = 1;
          } else if (p.type === "sweat") {
            ctx.globalAlpha = a;
            ctx.fillStyle = "#93c5fd";
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            ctx.fill();
            ctx.globalAlpha = 1;
          } else if (p.type === "note" || p.type === "emoji") {
            ctx.save();
            ctx.globalAlpha = a;
            ctx.fillStyle = p.type === "note" ? theme.c2 : "#fff";
            ctx.font = p.size + "px sans-serif";
            ctx.fillText(p.glyph, p.x, p.y);
            ctx.restore();
          } else if (p.type === "bang") {
            ctx.save();
            ctx.globalAlpha = a;
            ctx.fillStyle = "#f87171";
            ctx.font = "bold " + p.size + "px sans-serif";
            ctx.fillText("!", p.x, p.y);
            ctx.restore();
          } else if (p.type === "streak") {
            ctx.globalAlpha = a * 0.5;
            ctx.strokeStyle = "#fff";
            ctx.lineWidth = 1.2;
            ctx.beginPath();
            ctx.moveTo(p.x, p.y);
            ctx.lineTo(p.x + p.vx * 6, p.y);
            ctx.stroke();
            ctx.globalAlpha = 1;
          }
          if (p.life >= p.max) particles.splice(i, 1);
        }
      }

      function frame(now) {
        const dt = Math.min(50, now - last);
        last = now;
        updateParticles(now, dt);
        draw(now, dt);
        requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
